<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { brand: { DEFAULT: '#2563eb', dark: '#1d4ed8', light: '#eff6ff' } }
      } }
    };
  </script>
  <style type="text/tailwindcss">
    :root { --biru:#2563eb; --hijau:#059669; --merah:#dc2626; --oranye:#ea580c; --abu:#64748b; }
    * { -webkit-tap-highlight-color: transparent; }
    body { @apply bg-slate-100 text-slate-800 font-sans text-sm antialiased dark:bg-slate-950 dark:text-slate-200; margin: 0; }
    header { @apply bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3 sticky top-0 z-20 shadow-sm dark:bg-slate-900/95 dark:border-slate-800; }
    .logo { @apply w-14 h-14 rounded-2xl bg-brand-light text-brand flex items-center justify-center shrink-0 dark:bg-brand/20 dark:text-blue-300; }
    header .judul { @apply text-base font-bold tracking-tight text-slate-900 dark:text-white; }
    header .meta { @apply text-[11px] text-slate-500 mt-0.5 dark:text-slate-400; }
    .badge { @apply inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-brand-light text-brand-dark dark:bg-brand/25 dark:text-blue-200; }
    .themebtn { @apply w-9 h-9 rounded-xl border border-slate-200 bg-white text-slate-500 flex items-center justify-center shrink-0 transition hover:bg-slate-50 hover:text-brand dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700; }
    .shell { @apply flex items-start; }
    .sidebar { @apply flex-none bg-white/95 backdrop-blur border-r border-slate-200 sticky z-[19] overflow-y-auto overflow-x-hidden dark:bg-slate-900/95 dark:border-slate-800; top: 80px; height: calc(100vh - 80px); width: 210px; min-width: 210px; transition: width .18s ease, min-width .18s ease; }
    .sidebar::-webkit-scrollbar { width: 6px; } .sidebar::-webkit-scrollbar-thumb { @apply bg-slate-300 dark:bg-slate-700 rounded; }
    nav { @apply flex flex-col py-2; }
    nav button { @apply flex items-center gap-3 w-full px-4 py-2.5 text-[13px] text-slate-500 border-l-[3px] border-transparent whitespace-nowrap transition-colors hover:text-brand hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800/70; }
    nav button.active { @apply text-brand border-brand font-semibold bg-brand-light/60 dark:text-blue-300 dark:border-blue-300 dark:bg-brand/10; }
    nav button svg { @apply w-5 h-5 flex-none; }
    .sidebar.collapsed { width: 58px; min-width: 58px; }
    .sidebar.collapsed nav button { @apply justify-center gap-0 px-0; }
    .sidebar.collapsed nav button span { display: none; }
    main { @apply p-3 flex-1 min-w-0; }
    .sidetoggle { @apply w-9 h-9 rounded-xl border border-slate-200 bg-white text-slate-500 flex items-center justify-center shrink-0 transition hover:bg-slate-50 hover:text-brand dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700; }
    .staftip { @apply underline decoration-dotted decoration-slate-300 underline-offset-2 cursor-help dark:decoration-slate-600; }
    .mini-btn { @apply text-[11px] px-2.5 py-1 rounded-lg border border-brand text-brand font-semibold cursor-pointer transition hover:bg-brand-light dark:text-blue-300 dark:border-blue-400 dark:hover:bg-brand/20; }
    .cal-sug { @apply text-slate-400 hover:text-brand hover:bg-brand-light rounded-md p-0.5 shrink-0 transition cursor-pointer dark:hover:bg-brand/20; }
    .cal-sug svg { @apply w-4 h-4; }
    .card { @apply bg-white border border-slate-200 rounded-2xl p-4 mb-3 shadow-sm dark:bg-slate-900 dark:border-slate-800; }
    h2 { @apply text-[15px] font-semibold text-slate-800 mb-2.5 dark:text-slate-100; }
    .kpis { @apply grid gap-2.5; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .kpi { @apply bg-white border border-slate-200 rounded-2xl p-3.5 shadow-sm dark:bg-slate-900 dark:border-slate-800; }
    .kpi .n { @apply text-2xl font-bold tracking-tight; }
    .kpi .l { @apply text-[11px] text-slate-500 mt-1 dark:text-slate-400; }
    .status-final { @apply text-emerald-600 dark:text-emerald-400; } .status-draf { @apply text-orange-500 dark:text-orange-400; }
    label { @apply block mt-2.5 mb-1 font-medium text-xs text-slate-600 dark:text-slate-300; }
    input, select { @apply w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-white transition dark:bg-slate-800 dark:border-slate-600 dark:text-slate-100; }
    input:focus, select:focus { @apply outline-none ring-2 ring-brand border-transparent; }
    input[type="checkbox"], input[type="radio"] { @apply w-4 h-4 p-0 border-slate-300 rounded shrink-0; accent-color: #2563eb; }
    .kapab-item { @apply flex items-center gap-2 text-[13px] font-normal px-2.5 py-2 rounded-lg border border-slate-200 cursor-pointer transition hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800 mt-0; }
    .radio-card { @apply flex items-center gap-2 px-3 py-2.5 rounded-xl border border-slate-200 cursor-pointer text-[13px] font-normal mt-0 transition hover:border-brand dark:border-slate-700 dark:hover:border-brand; }
    .radio-card.sel { @apply border-brand bg-brand-light text-brand-dark font-semibold ring-1 ring-brand dark:bg-brand/20 dark:text-blue-200; }
    .radio-card input { @apply sr-only; }
    .day { @apply flex items-center justify-between bg-brand-light text-brand-dark font-semibold px-3 py-2 rounded-xl mt-3 mb-1 text-[13px] dark:bg-slate-800 dark:text-blue-200; }
    .docrow { @apply flex items-center gap-3 py-2.5 px-1 border-b border-slate-100 dark:border-slate-800; }
    .docinfo { @apply flex-1 min-w-0; }
    .docname { @apply text-[13px] font-medium leading-tight truncate; }
    .docspes { @apply text-[11px] text-slate-400 mt-0.5; }
    .chips { @apply flex flex-wrap gap-1.5 justify-end; max-width: 62%; }
    .pchip { @apply inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-[12px] border font-medium transition; }
    .pchip svg { @apply w-3 h-3 shrink-0; }
    button.pchip { @apply cursor-pointer hover:brightness-95; }
    .pchip.filled { @apply bg-brand-light border-transparent text-brand-dark dark:bg-brand/20 dark:text-blue-200; }
    .pchip.empty { @apply border border-dashed border-amber-400 text-amber-600 bg-amber-50 dark:bg-amber-500/10 dark:border-amber-500/50 dark:text-amber-300; }
    .pchip.pchip-card { @apply flex-col items-stretch gap-0.5 py-1.5; min-width: 150px; }
    .pchip-top { @apply inline-flex items-center gap-1; }
    .pchip-sub { @apply text-[10px] font-normal text-slate-500 dark:text-slate-400 leading-snug; }
    .cal { @apply grid grid-cols-7 gap-1; }
    .cal-h { @apply text-center text-[10px] font-semibold text-slate-400 py-1; }
    .cal-cell { @apply rounded-lg border border-slate-200 dark:border-slate-800 p-1 cursor-pointer transition hover:border-brand text-left; min-height: 54px; }
    .cal-cell.wknd { @apply bg-amber-50 dark:bg-slate-800/60; }
    .cal-cell.empty { @apply border-transparent cursor-default hover:border-transparent; }
    .cal-num { @apply text-[11px] font-semibold text-slate-600 dark:text-slate-300; }
    .cal-dots { @apply flex flex-wrap gap-0.5 mt-1; }
    .cdot { @apply text-[9px] leading-none px-1 py-0.5 rounded font-bold; }
    .cdot.a { @apply bg-brand-light text-brand-dark dark:bg-brand/25 dark:text-blue-200; }
    .cdot.r { @apply bg-purple-100 text-purple-700 dark:bg-purple-500/25 dark:text-purple-200; }
    .cdot.l { @apply bg-amber-100 text-amber-700 dark:bg-amber-500/25 dark:text-amber-200; }
    .cdot.warn { @apply bg-red-500 text-white; }
    .cal-cell.warn { @apply ring-1 ring-red-300 dark:ring-red-500/40; }
    .cal-cell.blk { @apply ring-2 ring-red-500 border-red-500; box-shadow: 0 0 0 1px #ef4444; }
    .weekrow.blk { @apply ring-2 ring-red-500 border-red-500; }
    .cal-cell.staf-off, .weekrow.staf-off { opacity: .55; background-image: repeating-linear-gradient(45deg, rgba(100,116,139,.12) 0 6px, transparent 6px 12px); }
    @media print {
      header, .sidebar, .no-print, .cal-sug, .themebtn { display: none !important; }
      main#main { display: block !important; width: 100% !important; }
      body { background: #fff !important; }
      .card { box-shadow: none !important; border: 1px solid #ddd !important; break-inside: avoid; }
    }
    .cstats { @apply flex flex-wrap gap-0.5 mt-1; }
    .cs { @apply text-[9px] leading-none px-1 py-0.5 rounded font-bold whitespace-nowrap; }
    .cs.a { @apply bg-brand-light text-brand-dark dark:bg-brand/25 dark:text-blue-200; }
    .cs.r { @apply bg-purple-100 text-purple-700 dark:bg-purple-500/25 dark:text-purple-200; }
    .cs.l { @apply bg-amber-100 text-amber-700 dark:bg-amber-500/25 dark:text-amber-200; }
    .cs.ls { @apply bg-teal-100 text-teal-700 dark:bg-teal-500/25 dark:text-teal-200; }
    .cs.lsr { @apply bg-indigo-100 text-indigo-700 dark:bg-indigo-500/25 dark:text-indigo-200; }
    .cs.k { @apply bg-red-500 text-white; }
    .cs.bad { @apply ring-1 ring-red-400 dark:ring-red-500/60; }
    .cellwarn { @apply inline-flex items-center justify-center text-[9px] text-white bg-red-500 rounded-full w-3.5 h-3.5 font-bold align-middle; }
    .seg3 { @apply grid grid-cols-3 gap-1 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl; }
    .seg3 button { @apply py-1.5 px-2 rounded-lg text-[12px] font-medium text-slate-500 transition; }
    .seg3 button.on { @apply bg-white dark:bg-slate-900 text-brand shadow-sm; }
    .weekrow { @apply flex items-center justify-between p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 mb-1.5 cursor-pointer transition hover:border-brand; }
    .weekrow.warn { @apply ring-1 ring-red-300 dark:ring-red-500/40; }
    .weekrow.disabled { @apply opacity-50 cursor-default hover:border-slate-200 dark:hover:border-slate-800; }
    .weekrow .wd { @apply text-[13px] font-medium; }
    /* ---- Mingguan: 7 kolom bergaya Harian (ringkas) + scroll horizontal ---- */
    .wkwrap { @apply overflow-x-auto pb-1; }
    .wkgrid { @apply grid gap-2; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); }
    .wk-col { @apply rounded-xl border border-slate-200 dark:border-slate-800 flex flex-col overflow-hidden bg-white dark:bg-slate-900; }
    .wk-col.warn { @apply ring-1 ring-red-300 dark:ring-red-500/40; }
    .wk-col.blk { @apply ring-2 ring-red-500 border-red-500; }
    .wk-col.staf-off { opacity: .55; background-image: repeating-linear-gradient(45deg, rgba(100,116,139,.12) 0 6px, transparent 6px 12px); }
    .wk-col.disabled { @apply bg-slate-50 dark:bg-slate-800/40 border-dashed; }
    .wk-head { @apply sticky top-0 z-10 flex items-center justify-between gap-1 px-2 py-1.5 text-[12px] font-semibold bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 cursor-pointer transition hover:text-brand; }
    .wk-col.disabled .wk-head { @apply cursor-default text-slate-400 font-medium hover:text-slate-400; }
    .wk-body { @apply p-2 overflow-y-auto; max-height: 68vh; }
    .wk-empty { @apply p-3 text-[11px] text-slate-400; }
    /* skala ringkas untuk isi kolom mingguan */
    .wk-body .det-sec { @apply mt-2 pt-2; }
    .wk-body .det-title { @apply text-[11px] mb-0.5; }
    .wk-body .det-title svg { @apply w-3.5 h-3.5; }
    .wk-body .docrow { @apply flex-col items-stretch gap-1 py-1.5 px-0; }
    .wk-body .docname { @apply text-[12px] whitespace-normal; }
    .wk-body .docspes { @apply text-[10px]; }
    .wk-body .chips { @apply justify-start gap-1; max-width: 100%; }
    .wk-body .pchip { @apply px-1.5 py-1 text-[11px]; }
    .wk-body .pchip.pchip-card { min-width: 100%; }
    .wk-body .pchip-sub { @apply text-[9px]; }
    .wk-body .staffline { @apply text-[11px]; }
    .wk-body .warnbox { @apply text-[11px] px-2 py-1.5 mb-1.5; }
    .wk-body .blktag { @apply text-[10px]; }
    @media print {
      .wkwrap { overflow: visible !important; }
      .wkgrid { grid-auto-flow: row !important; grid-auto-columns: auto !important; }
      .wk-body { max-height: none !important; overflow: visible !important; }
      .wk-col { break-inside: avoid; }
      .wk-head { position: static !important; }
    }
    .navbtn { @apply w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-500 hover:text-brand hover:border-brand transition; }
    .det-sec { @apply mt-3 pt-3 border-t border-slate-100 dark:border-slate-800; }
    .det-sec:first-of-type { @apply mt-1 pt-0 border-0; }
    .det-title { @apply text-[12px] font-semibold text-slate-500 mb-1 dark:text-slate-400 flex items-center gap-1.5; }
    .det-title svg { @apply w-4 h-4 shrink-0; }
    .drawer-bg { @apply fixed inset-0 bg-black/20 hidden justify-end z-40; }
    .drawer-bg.show { @apply flex; }
    .drawer { @apply bg-white dark:bg-slate-900 h-full w-full max-w-md overflow-y-auto p-4 shadow-2xl; animation: slideIn .2s ease; }
    @keyframes slideIn { from { transform: translateX(30px); opacity: .4; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes popIn { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .drawer-head { @apply flex items-center justify-between sticky -top-4 bg-white dark:bg-slate-900 pt-1 pb-2 z-10; }
    .seg2 { @apply grid grid-cols-2 gap-1 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl my-2; }
    .seg2 button { @apply flex items-center justify-center gap-1.5 py-2 rounded-lg text-[13px] font-medium text-slate-500 transition; }
    .seg2 button.on { @apply bg-white dark:bg-slate-900 text-brand shadow-sm; }
    .katflag { @apply text-[9px] px-1 py-0.5 rounded font-bold; }
    .katflag.new { @apply bg-blue-100 text-blue-700 dark:bg-blue-500/25 dark:text-blue-200; }
    .katflag.exist { @apply bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300; }
    .staffline { @apply flex items-center gap-1.5 text-[13px] py-0.5; }
    .staffline svg { @apply w-3.5 h-3.5 shrink-0; }
    .docrow.warn { @apply border-l-2 border-l-amber-400 pl-2 rounded-r bg-amber-50/50 dark:bg-amber-500/5; }
    .docrow.blk { @apply border-l-4 border-l-red-500 pl-2 rounded-r bg-red-50 dark:bg-red-500/10; box-shadow: inset 0 0 0 1px rgba(239,68,68,.35); }
    .blktag { @apply text-[11px] font-semibold text-red-600 dark:text-red-400 mt-1; }
    .blkpill { @apply text-[10px] font-bold text-red-700 bg-red-100 dark:bg-red-500/20 dark:text-red-300 rounded px-1.5 py-0.5 ml-1 align-middle; }
    .lsflag { @apply text-[9px] px-1 py-0.5 rounded font-bold bg-indigo-100 text-indigo-700 dark:bg-indigo-500/25 dark:text-indigo-200; white-space: nowrap; }
    .warnbox { @apply text-[12px] px-2.5 py-2 rounded-lg bg-amber-50 text-amber-700 ring-1 ring-amber-200 mb-2 font-medium dark:bg-amber-500/10 dark:text-amber-300 dark:ring-amber-500/30; }
    .resep-kurang { @apply ring-1 ring-red-300 bg-red-50 rounded-lg p-2 dark:bg-red-500/10 dark:ring-red-500/40; }
    .baris2 { @apply flex gap-2.5; } .baris2>div { @apply flex-1; }
    button.act { @apply w-full mt-3 px-3 py-3 bg-brand text-white rounded-xl text-sm font-semibold shadow-sm transition hover:bg-brand-dark active:scale-[.99] disabled:bg-slate-400 disabled:active:scale-100; }
    button.sec { @apply bg-white text-brand border border-brand hover:bg-brand-light dark:bg-slate-800 dark:hover:bg-slate-700; }
    button.warn { @apply bg-emerald-600 hover:bg-emerald-700; }
    .pesan { @apply mt-2.5 px-3 py-2.5 rounded-xl text-xs hidden; }
    .pesan.ok { @apply block bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-300 dark:ring-emerald-500/30; }
    .pesan.err { @apply block bg-red-50 text-red-600 ring-1 ring-red-200 dark:bg-red-500/10 dark:text-red-300 dark:ring-red-500/30; }
    .tgl-head { @apply bg-brand-light text-brand-dark font-semibold px-3 py-2 rounded-xl mt-3 mb-1.5 text-[13px] dark:bg-slate-800 dark:text-blue-200; }
    .slot { @apply flex items-center gap-3 px-1.5 py-2.5 border-b border-slate-100 dark:border-slate-800; }
    .slot .dok { @apply flex-1 text-[13px] leading-snug; } .slot .dok small { @apply text-slate-400; }
    .slot .prw { @apply flex-1; }
    .chip { @apply px-3 py-2 rounded-lg text-[13px] cursor-pointer border border-slate-300 bg-white w-full text-left transition hover:border-brand dark:bg-slate-800 dark:border-slate-600 dark:text-slate-200; }
    .chip.ok { @apply bg-emerald-50 border-emerald-200 text-emerald-800 dark:bg-emerald-500/10 dark:border-emerald-500/30 dark:text-emerald-300; }
    .chip.oranye { @apply bg-amber-50 border-amber-200 text-amber-800 dark:bg-amber-500/10 dark:border-amber-500/30 dark:text-amber-300; }
    .chip.merah { @apply bg-red-50 border-red-200 text-red-700 dark:bg-red-500/10 dark:border-red-500/30 dark:text-red-300; }
    .chip.kosong { @apply text-slate-400 italic; }
    .shift-tag { @apply text-[10px] px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-500 font-medium dark:bg-slate-700 dark:text-slate-300; }
    table { @apply w-full border-collapse text-xs; }
    th { @apply text-left px-1.5 py-2 border-b-2 border-slate-200 text-slate-500 font-semibold dark:border-slate-700 dark:text-slate-400; }
    td { @apply px-1.5 py-2 border-b border-slate-100 dark:border-slate-800; }
    .hapus { @apply text-red-600 cursor-pointer text-[11px] underline hover:text-red-800 dark:text-red-400; }
    .muted { @apply text-slate-500 text-xs dark:text-slate-400; }
    .loading { @apply text-center py-8 text-slate-400; }
    .modal-bg { @apply fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50; }
    .modal-bg.show { @apply flex; animation: fadeIn .16s ease; }
    .modal { @apply bg-white w-full max-w-md max-h-[75vh] overflow-y-auto rounded-2xl p-4 shadow-2xl dark:bg-slate-900; animation: popIn .16s ease; }
    .chipact { @apply cursor-pointer text-slate-400 inline-flex items-center shrink-0 hover:text-brand; }
    .chipact.chipdel:hover { @apply text-red-600; }
    .modal h3 { @apply mb-1 text-[15px] font-semibold dark:text-slate-100; }
    .opt { @apply px-2 py-2 border-b border-slate-100 cursor-pointer flex justify-between items-center gap-2 text-[13px] transition hover:bg-slate-50 dark:border-slate-800 dark:hover:bg-slate-800; }
    .opt .lv { @apply text-[10px] px-1.5 py-0.5 rounded-md font-medium; }
    .opt.optwarn { @apply bg-red-50 dark:bg-red-500/10; }
    .gold { @apply bg-amber-100 text-amber-800; } .silver { @apply bg-slate-100 text-slate-500; }
    .warnkap { @apply text-orange-500 text-[11px]; }
    .overlay { @apply fixed inset-0 bg-white/85 backdrop-blur-sm hidden items-center justify-center z-[60] flex-col dark:bg-slate-950/85; }
    .overlay.show { @apply flex; }
    .spin { @apply w-9 h-9 border-4 border-slate-200 rounded-full dark:border-slate-700; border-top-color: var(--biru); animation: sp 1s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <div class="flex items-center gap-3 w-full">
      <button class="sidetoggle" id="sideToggle" onclick="toggleSidebar()" title="Sembunyikan / tampilkan menu" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="logo" style="background:#fff" id="hLogo">
        <img src="https://lh3.googleusercontent.com/d/1F079kFgslnnU3G9hfDOnXSAjsEOV-okg=w96" alt="Audy Dental"
             style="width:100%;height:100%;object-fit:contain;border-radius:inherit;padding:3px"
             onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://drive.google.com/thumbnail?id=1F079kFgslnnU3G9hfDOnXSAjsEOV-okg&amp;sz=w96';}else{this.style.display='none';document.getElementById('hLogoFallback').style.display='flex';}">
        <span id="hLogoFallback" class="w-full h-full items-center justify-center text-brand" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
          </svg>
        </span>
      </div>
      <div class="min-w-0 flex-1">
        <div class="judul">Penjadwalan Audy Dental</div>
        <div class="meta" id="hMeta">Memuat…</div>
      </div>
      <button class="themebtn" id="themeBtn" onclick="toggleTheme()" title="Ganti tema"></button>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar"><nav><div id="nav"></div></nav></aside>
    <main id="main"><div class="loading">Memuat aplikasi…</div></main>
  </div>

  <div class="drawer-bg" id="drawerBg" onclick="tutupDrawer(event)">
    <div class="drawer" id="drawer"></div>
  </div>
  <div class="modal-bg" id="modalBg" onclick="tutupModal(event)">
    <div class="modal" id="modal"></div>
  </div>
  <div class="overlay" id="overlay"><div class="spin"></div><p id="overlayTxt" class="muted" style="margin-top:10px"></p></div>

<script>
  let CTX = null;
  let VIEW = 'dashboard';

  // Ikon SVG (Heroicons outline) — lebih modern dari emoji
  const IC = {
    dashboard: '<path d="M3 13h8V3H3v10zm10 8h8V3h-8v18zM3 21h8v-6H3v6z"/>',
    kalender: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',
    cuti: '<path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    aksi: '<path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/>',
    kepatuhan: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
    pref: '<path d="M12 2l3 7h7l-5.5 4 2 7-6.5-4-6.5 4 2-7L2 9h7z"/>',
    cetak: '<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
    master: '<circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.13a4 4 0 0 1 0 7.75M22 21v-2a4 4 0 0 0-3-3.87"/>',
    pengaturan: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H2a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 8a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V2a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H22a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'
    ,
    gen: '<path d="M12 3l1.9 4.8L18 9l-4.1 1.2L12 15l-1.9-4.8L6 9l4.1-1.2z"/><path d="M19 14l.6 1.7 1.7.6-1.7.6L19 20l-.6-1.7-1.7-.6 1.7-.6z"/>',
    final: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>',
    saran: '<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>'
  };
  IC.jadwal = IC.kalender || IC.cetak; // menu gabungan Jadwal Karyawan
  function svg(id){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (IC[id]||'') + '</svg>'; }
  function svgPx(id, px){ return '<svg viewBox="0 0 24 24" width="' + px + '" height="' + px + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none">' + (IC[id]||'') + '</svg>'; }

  const NAV = [
    { id: 'dashboard', label: 'Dashboard', roles: ['Admin','SPV','Viewer'] },
    { id: 'master', label: 'Master Data', roles: ['Admin'] },
    { id: 'cuti', label: 'Request Jadwal', roles: ['Admin','SPV'] },
    { id: 'aksi', label: 'Aksi', roles: ['Admin','SPV'] },
    { id: 'jadwal', label: 'Jadwal Karyawan', roles: ['Admin','SPV','Viewer'] },
    { id: 'pengaturan', label: 'Hak Akses', roles: ['Admin'] }
  ];

  // ---- Tema (dark / light) ----
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  function bacaTema(){ try { return localStorage.getItem('audy_tema') || 'light'; } catch(e){ return 'light'; } }
  function terapkanTema(t){
    document.documentElement.classList.toggle('dark', t === 'dark');
    const b = document.getElementById('themeBtn'); if (b) b.innerHTML = (t === 'dark' ? SUN : MOON);
  }
  function toggleTema(){ // alias
    const t = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
    try { localStorage.setItem('audy_tema', t); } catch(e){}
    terapkanTema(t);
  }
  function toggleTheme(){ toggleTema(); }
  terapkanTema(bacaTema());

  // ---- Sidebar collapse ----
  function bacaSidebar(){ try { return localStorage.getItem('audy_sidebar'); } catch(e){ return null; } }
  function terapkanSidebar(){
    const sb = document.getElementById('sidebar'); if (!sb) return;
    const s = bacaSidebar();
    const collapse = (s === null) ? (window.innerWidth < 720) : (s === '1');
    sb.classList.toggle('collapsed', collapse);
  }
  function toggleSidebar(){
    const sb = document.getElementById('sidebar'); if (!sb) return;
    const col = sb.classList.toggle('collapsed');
    try { localStorage.setItem('audy_sidebar', col ? '1' : '0'); } catch(e){}
  }
  terapkanSidebar();

  function overlay(on, txt) { document.getElementById('overlayTxt').textContent = txt || ''; document.getElementById('overlay').classList.toggle('show', on); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---- init ----
  google.script.run.withSuccessHandler(c => {
    CTX = c;
    if (!c.boleh) {
      document.getElementById('hMeta').innerHTML = esc(c.email);
      const sb = document.getElementById('sidebar'); if (sb) sb.style.display = 'none';
      document.getElementById('main').innerHTML =
        '<div class="card" style="text-align:center;padding:2rem 1rem">' +
        '<div style="font-size:40px">🔒</div>' +
        '<h2 style="justify-content:center">Akses ditolak</h2>' +
        '<p class="muted">Email <b>' + esc(c.email) + '</b> belum terdaftar di daftar akses. Hubungi Admin untuk didaftarkan.</p></div>';
      return;
    }
    document.getElementById('hMeta').innerHTML =
      '<span class="badge">' + c.peran + '</span> ' + esc(c.email) +
      (c.periodeMulai ? ' · Periode ' + c.periodeMulai + '–' + c.periodeAkhir : ' · periode belum diset');
    renderNav();
    const firstBtn = document.querySelector('nav button');
    go(firstBtn ? firstBtn.dataset.id : 'dashboard');
  }).withFailureHandler(e => { document.getElementById('main').innerHTML = '<div class="card">Gagal memuat: ' + esc(e.message) + '</div>'; }).getWebContext();

  // Cek akses modul; bila daftar modul tak ada (backend lama) → izinkan (fallback).
  function punyaModul(id) { return !(CTX.modul && CTX.modul.length) || CTX.modul.indexOf(id) !== -1; }
  function navBoleh(n) {
    if (n.id === 'pengaturan') return CTX.peran === 'Admin';
    if (CTX.modul && CTX.modul.length) {
      // Request Jadwal (cuti) memuat sub-tab Preferensi (pref) → tampil bila salah satu aktif
      if (n.id === 'cuti') return CTX.modul.indexOf('cuti') !== -1 || CTX.modul.indexOf('pref') !== -1;
      // Jadwal Karyawan memuat sub-tab Kalender (kalender) + List (cetak) → tampil bila salah satu aktif
      if (n.id === 'jadwal') return CTX.modul.indexOf('kalender') !== -1 || CTX.modul.indexOf('cetak') !== -1;
      return CTX.modul.indexOf(n.id) !== -1;
    }
    return n.roles.indexOf(CTX.peran) !== -1; // fallback bila backend lama
  }
  function renderNav() {
    const nav = document.getElementById('nav'); nav.innerHTML = '';
    NAV.filter(navBoleh).forEach(n => {
      const b = document.createElement('button');
      b.innerHTML = svg(n.id) + '<span>' + n.label + '</span>'; b.dataset.id = n.id;
      b.title = n.label; // tampil saat sidebar collapse (hover)
      b.className = (n.id === VIEW ? 'active' : '');
      b.onclick = () => go(n.id);
      nav.appendChild(b);
    });
  }

  function go(id) {
    VIEW = id;
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.id === id));
    const m = document.getElementById('main');
    m.innerHTML = '<div class="loading">Memuat…</div>';
    if (id === 'dashboard') viewDashboard(m);
    else if (id === 'jadwal') viewJadwal(m);
    else if (id === 'cuti') viewCuti(m);
    else if (id === 'pref') viewPref(m);
    else if (id === 'pengaturan') viewPengaturan(m);
    else if (id === 'aksi') viewAksi(m);
    else if (id === 'master') viewMaster(m);
  }

  // ---- Dashboard ----
  function viewDashboard(m) {
    google.script.run.withSuccessHandler(d => {
      if (!d.ok) { m.innerHTML = '<div class="card">' + esc(d.pesan) + '<br><span class="muted">Buka tab ⚡ Aksi untuk generate jadwal.</span></div>'; return; }
      const st = d.status.indexOf('FINAL') === 0;
      m.innerHTML =
        '<div class="card"><h2>Status Periode ' + esc(d.periode) + '</h2>' +
        '<div style="font-size:18px;font-weight:700" class="' + (st?'status-final':'status-draf') + '">' + esc(d.status) + '</div></div>' +
        '<div class="kpis">' +
        kpi(d.blocker, 'Blocker finalisasi', d.blocker>0?'var(--merah)':'var(--hijau)') +
        kpi(d.slotTerisi+'/'+d.slotTotal, 'Slot asistensi terisi') +
        kpi(d.dokterTanpaPerawat, 'Dokter tanpa perawat', d.dokterTanpaPerawat>0?'var(--merah)':'var(--hijau)') +
        kpi(d.shiftKurang, 'Shift resepsionis kurang') +
        kpi(d.prwPatuh+'/'+d.prwTotal, 'Perawat sesuai') +
        kpi(d.rcpPatuh+'/'+d.rcpTotal, 'Resepsionis sesuai') +
        kpi(d.temuan, 'Total temuan') +
        '</div>';
    }).getDashboardWeb();
  }
  function kpi(n, l, warna) { return '<div class="kpi"><div class="n" style="color:' + (warna||'#202124') + '">' + esc(n) + '</div><div class="l">' + esc(l) + '</div></div>'; }

  // ---- Kepatuhan (live audit) ----
  let KEP = null, KEP_TAB = 'perawat', KEP_Q = '', KEP_ONLY = false;
  function viewKepatuhan(m) {
    m.innerHTML = '<div class="loading">Memuat kesesuaian…</div>';
    google.script.run.withSuccessHandler(d => {
      if (!d.ok) { m.innerHTML = '<div class="card">' + esc(d.pesan) + '<br><span class="muted">Buka tab ⚡ Aksi untuk generate jadwal.</span></div>'; return; }
      KEP = d; renderKepatuhan();
    }).withFailureHandler(e => { m.innerHTML = '<div class="card">Gagal memuat: ' + esc(e.message) + '</div>'; }).getRekapKepatuhanWeb();
  }
  function kepBtnStyle(t){ return 'padding:6px 12px;border-radius:8px;border:1px solid var(--border,#d0d5dd);cursor:pointer;font-size:13px;' + (KEP_TAB===t?'background:#1a73e8;color:#fff;font-weight:600;border-color:#1a73e8':'background:transparent'); }
  function kepTab(t){ KEP_TAB = t; renderKepatuhan(); }
  function kepSearch(v){ KEP_Q = (v||'').toLowerCase(); renderKepatuhanTable(); }
  function kepToggleIssue(c){ KEP_ONLY = c; renderKepatuhanTable(); }
  function statusCell(x){ return x.patuh ? '<span style="color:var(--hijau,#188038);font-weight:600">✅ sesuai</span>' : '<span style="color:#b06000;font-weight:600">' + esc(x.status) + '</span>'; }
  function renderKepatuhan(){
    const m = document.getElementById(KEP_HOST) || document.getElementById('main'); const d = KEP;
    const st = d.status.indexOf('FINAL') === 0;
    const warnCount = d.temuan.filter(x => x.jenis === 'warning').length;
    m.innerHTML =
      '<div class="card"><h2>Kesesuaian Jadwal · ' + esc(d.periode) + '</h2>' +
      '<div style="font-size:16px;font-weight:700" class="' + (st?'status-final':'status-draf') + '">' + esc(d.status) + '</div>' +
      '<div class="muted" style="margin-top:4px">Dihitung langsung dari papan terkini — setiap perubahan manual otomatis tercermin saat halaman di-refresh.</div></div>' +
      '<div class="kpis">' +
        kpi(d.blocker, 'Blocker finalisasi', d.blocker>0?'var(--merah)':'var(--hijau)') +
        kpi(d.prwPatuh + '/' + d.perawat.length, 'Perawat sesuai') +
        kpi(d.rcpPatuh + '/' + d.rcp.length, 'Resepsionis sesuai') +
        kpi(warnCount, 'Warning (non-blocker)') +
      '</div>' +
      '<div class="card">' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">' +
          '<button onclick="kepTab(\'perawat\')" style="' + kepBtnStyle('perawat') + '">Perawat (' + d.perawat.length + ')</button>' +
          '<button onclick="kepTab(\'rcp\')" style="' + kepBtnStyle('rcp') + '">Resepsionis (' + d.rcp.length + ')</button>' +
          '<input oninput="kepSearch(this.value)" placeholder="Cari nama…" value="' + esc(KEP_Q) + '" style="flex:1;min-width:120px;padding:6px 10px;border:1px solid var(--border,#d0d5dd);border-radius:8px;background:transparent;color:inherit"/>' +
          '<label class="muted" style="display:flex;gap:5px;align-items:center;font-size:12px;cursor:pointer"><input type="checkbox" onchange="kepToggleIssue(this.checked)"' + (KEP_ONLY?' checked':'') + '> hanya bermasalah</label>' +
        '</div>' +
        '<div id="kepTbl"></div>' +
      '</div>' +
      '<div class="card"><details><summary style="cursor:pointer;font-weight:600">Breakdown longshift (perawat &amp; resepsionis)</summary><div id="kepBreak" style="margin-top:8px"></div></details></div>' +
      '<div class="card"><details open><summary style="cursor:pointer;font-weight:600">Temuan & pelanggaran (' + d.temuan.length + ')</summary><div id="kepTemuan" style="margin-top:8px"></div></details></div>';
    renderKepatuhanTable(); renderKepatuhanTemuan(); renderKepatuhanBreak();
  }
  function renderKepatuhanBreak(){
    const box = document.getElementById('kepBreak'); if (!box) return; const d = KEP;
    const num = s => { const m = String(s).match(/\d+/); return m ? +m[0] : 0; };
    const tbl = (title, arr) => {
      let rows = arr.slice().sort((a,b)=> num(b.longshift)-num(a.longshift))
        .map(x => '<tr><td>'+esc(x.nama)+'</td><td style="text-align:center">'+esc(x.longshift)+'</td></tr>').join('');
      if (!rows) rows = '<tr><td colspan="2" class="muted">–</td></tr>';
      return '<div style="flex:1;min-width:180px"><div style="font-weight:600;margin-bottom:4px">'+title+' ('+arr.length+')</div><div style="overflow-x:auto"><table><tr><th>Nama</th><th style="text-align:center">Longshift</th></tr>'+rows+'</table></div></div>';
    };
    box.innerHTML = '<div style="display:flex;gap:16px;flex-wrap:wrap">'+tbl('Perawat', d.perawat)+tbl('Resepsionis', d.rcp)+'</div>';
  }
  function renderKepatuhanTable(){
    const box = document.getElementById('kepTbl'); if (!box) return;
    const d = KEP, q = KEP_Q || '';
    if (KEP_TAB === 'perawat') {
      const rows = d.perawat.filter(p => p.nama.toLowerCase().indexOf(q) !== -1 && (!KEP_ONLY || !p.patuh));
      let h = '<div style="overflow-x:auto"><table><tr><th>Perawat</th><th>Total Assistance</th><th>Longshift</th><th>Libur</th><th>Belum Asistensi</th><th>Status</th></tr>';
      rows.forEach(p => { h += '<tr style="' + (p.patuh?'':'background:rgba(234,179,8,.10)') + '">' +
        '<td>' + levelIc(p.level) + ' ' + katIc(p.kategori) + ' ' + esc(p.nama) + '</td>' +
        '<td>' + esc(p.totalSlot) + '</td><td>' + esc(p.longshift) + '</td><td>' + esc(p.libur) + '</td>' +
        '<td>' + esc(p.spesKurang) + '</td><td>' + statusCell(p) + '</td></tr>'; });
      if (!rows.length) h += '<tr><td colspan="6" class="muted">Tidak ada data.</td></tr>';
      box.innerHTML = h + '</table></div>';
    } else {
      const rows = d.rcp.filter(r => r.nama.toLowerCase().indexOf(q) !== -1 && (!KEP_ONLY || !r.patuh));
      let h = '<div style="overflow-x:auto"><table><tr><th>Resepsionis</th><th>Total Shift</th><th>Longshift</th><th>Libur</th><th>Status</th></tr>';
      rows.forEach(r => { h += '<tr style="' + (r.patuh?'':'background:rgba(234,179,8,.10)') + '">' +
        '<td>' + levelIc(r.level) + ' ' + esc(r.nama) + '</td>' +
        '<td>' + esc(r.totalSlot) + '</td><td>' + esc(r.longshift) + '</td><td>' + esc(r.libur) + '</td>' +
        '<td>' + statusCell(r) + '</td></tr>'; });
      if (!rows.length) h += '<tr><td colspan="5" class="muted">Tidak ada data.</td></tr>';
      box.innerHTML = h + '</table></div>';
    }
  }
  // Bersihkan teks detail: buang kode di depan (sudah ada badge), buang (warning)/(info),
  // dan ringkas "[TIDAK MUNGKIN: … di luar kapabilitas]" yang berulang.
  function bersihDetail(t){
    let s = String(t.detail || '').replace(/\s*\((warning|info)\)\s*/gi, ' ').trim();
    const k = String(t.aturan || '').replace(/[-\/]/g, '\\$&');
    if (k) s = s.replace(new RegExp('^' + k + '\\s*[:\\-–]\\s*'), '').trim();
    s = s.replace(/\s*\[TIDAK MUNGKIN:[^\]]*\]/i, ' — di luar kapabilitas');
    return s.trim();
  }
  function renderKepatuhanTemuan(){
    const box = document.getElementById('kepTemuan'); if (!box) return;
    const d = KEP;
    if (!d.temuan.length) { box.innerHTML = '<div style="color:var(--hijau,#188038);font-weight:600">✅ Tidak ada temuan — semua sesuai aturan.</div>'; return; }
    const namaKel = { N: 'Perawat (N)', A: 'Asistensi (A)', R: 'Resepsionis (R)', D: 'Data & Operasional' };
    const kodeBadge = (kode, bg, fg) => '<span style="flex:none;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:'+bg+';color:'+fg+'">'+esc(kode)+'</span>';
    const baris = (t, blk) => '<div style="display:flex;gap:8px;align-items:flex-start;' +
      (blk ? 'padding:7px 10px;border-left:3px solid #c5221f;background:rgba(197,34,31,.05);border-radius:6px;margin-bottom:5px'
           : 'padding:6px 4px;border-bottom:1px solid var(--border,#eee)') + '">' +
      kodeBadge(t.aturan, blk?'#fde8e8':'#fef3cd', blk?'#b02a2a':'#8a6100') +
      '<div style="flex:1;font-size:' + (blk?'13px':'12px') + ';line-height:1.45"><b>' + esc(t.lokasi) + '</b>' +
      (bersihDetail(t) ? ' — ' + esc(bersihDetail(t)) : '') + '</div></div>';

    // A-05 (slot asisten kosong) & R-03/R-04 (shift kurang) kini sudah tercatat rinci per tanggal/dokter di temuan.
    const blockers = d.temuan.filter(x => x.jenis === 'blocker');
    const warns = d.temuan.filter(x => x.jenis !== 'blocker');
    let html = '';

    // 1) Blocker — yang wajib diperbaiki, ditonjolkan
    if (blockers.length) {
      html += '<div style="font-weight:700;color:#c5221f;margin:2px 0 7px">🔴 Perlu diperbaiki — ' + blockers.length + ' blocker</div>';
      blockers.forEach(t => html += baris(t, true));
    } else {
      html += '<div style="font-weight:600;color:var(--hijau,#188038);margin-bottom:6px">✅ Tidak ada blocker — jadwal bisa difinalkan.</div>';
    }

    // 2) Warning — pisahkan yang "di luar kapabilitas" (mustahil) ke grup sendiri
    if (warns.length) {
      const cocokMustahil = x => /di luar kapabilitas|TIDAK MUNGKIN/i.test(x.detail || '');
      const mustahil = warns.filter(cocokMustahil);
      const biasa = warns.filter(x => !cocokMustahil(x));
      const belumKe = t => bersihDetail(t).replace(/\s*—\s*di luar kapabilitas\s*$/i, '').trim();
      const barisMustahil = t => '<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 4px;border-bottom:1px solid var(--border,#eee)">' +
        '<span style="flex:none;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:#f3e8ff;color:#6b21a8">' + esc(t.aturan) + '</span>' +
        '<div style="flex:1;font-size:12px;line-height:1.45"><b>' + esc(t.lokasi) + '</b>' + (belumKe(t) ? ' — ' + esc(belumKe(t)) : '') + '</div></div>';
      html += '<details style="margin-top:12px"' + (blockers.length ? '' : ' open') + '>' +
        '<summary style="cursor:pointer;font-weight:600;color:#8a6100">🟡 Peringatan (tidak menghalangi FINAL &amp; tetap sesuai) — ' + warns.length + '</summary>';
      // a) Warning biasa — masih bisa dikejar, per keluarga
      if (biasa.length) {
        html += '<div class="muted" style="font-size:11px;margin:5px 0 6px">Belum rotasi asistensi ke spesialis tertentu — masih bisa dikejar di sisa periode.</div>';
        ['N', 'A', 'R', 'D'].forEach(kk => {
          const arr = biasa.filter(x => (x.keluarga || 'D') === kk);
          if (!arr.length) return;
          html += '<div style="font-weight:600;font-size:12px;margin:9px 0 3px">▸ ' + namaKel[kk] + ' <span class="muted" style="font-weight:400">(' + arr.length + ')</span></div>';
          arr.forEach(t => html += baris(t, false));
        });
      }
      // b) Di luar kapabilitas — grup terpisah + tanda 🔒
      if (mustahil.length) {
        html += '<div style="font-weight:700;font-size:12px;margin:14px 0 3px;color:#6b21a8">🔒 Di luar kapabilitas — ' + mustahil.length + '</div>' +
          '<div class="muted" style="font-size:11px;margin-bottom:5px">Perawat belum kapabel ke spesialis ini, jadi mustahil dipenuhi lewat penjadwalan. Tindak lanjut: pelatihan / tambah kapabilitas — bukan menahan finalisasi.</div>';
        mustahil.forEach(t => html += barisMustahil(t));
      }
      html += '</details>';
    }
    box.innerHTML = html;
  }

  // ---- Cetak Jadwal (jadwal lengkap + jadwal pribadi staf + arsip periode final) ----
  let CET = null, CET_WHO = '', CET_LIVE = null, CET_ARSIP = [], CET_PER = 'live';

  function ensureJadwalStyle() {
    if (document.getElementById('jadwalStyle')) return;

  function viewCetak(m) {
    ensureJadwalStyle();
    m.innerHTML = '<div class="loading">Memuat jadwal…</div>';
    let live = null, arsip = null;
    const done = () => {
      if (live === null || arsip === null) return;
      CET_ARSIP = arsip || [];
      if (live.ok) {
        CET_LIVE = live; CET_PER = 'live'; CET = live; applyDefaultWho(); renderCetak();
      } else if (CET_ARSIP.length) {
        CET_LIVE = null; onCetPeriodeInit(CET_ARSIP[0].periode, m);
      } else {
        m.innerHTML = '<div class="card">' + esc(live.pesan || 'Jadwal belum ada') + '<br><span class="muted">Buka tab ⚡ Aksi untuk generate jadwal.</span></div>';
      }
    };
    google.script.run.withSuccessHandler(d => { live = d; done(); }).withFailureHandler(e => { live = { ok: false, pesan: e.message }; done(); }).getKalenderData();
    google.script.run.withSuccessHandler(a => { arsip = a; done(); }).withFailureHandler(() => { arsip = []; done(); }).getArsipList();
  }
  function onCetPeriodeInit(periode, m) {
    google.script.run.withSuccessHandler(d => {
      if (!d.ok) { m.innerHTML = '<div class="card">' + esc(d.pesan) + '</div>'; return; }
      CET_PER = periode; CET = { mulai: d.mulai, akhir: d.akhir, dates: d.dates, map: d.map }; applyDefaultWho(); renderCetak();
    }).withFailureHandler(e => { m.innerHTML = '<div class="card">Gagal memuat arsip: ' + esc(e.message) + '</div>'; }).getArsipData(periode);
  }
  function applyDefaultWho() {
    if (!(CET && CET.dates)) return;
    const em = (CTX && CTX.email) ? CTX.email.toLowerCase() : '';
    const nm = (CTX && CTX.nama) ? CTX.nama.toLowerCase() : '';
    const staf = CET.staf || {};
    let target = '';
    if (em) { Object.keys(staf).forEach(k => { if (staf[k].email && staf[k].email === em) target = staf[k].nama; }); }
    if (!target && nm) { const hit = cetakNames().find(n => n.toLowerCase() === nm); if (hit) target = hit; }
    if (target) CET_WHO = target;
  }
  function onCetPeriode(v) {
    CET_PER = v; CET_WHO = '';
    if (v === 'live') { CET = CET_LIVE; applyDefaultWho(); renderCetak(); return; }
    const prev = document.getElementById('cetPrev'); if (prev) prev.innerHTML = '<div class="loading">Memuat arsip…</div>';
    google.script.run.withSuccessHandler(d => {
      if (!d.ok) { alert(d.pesan); return; }
      CET = { mulai: d.mulai, akhir: d.akhir, dates: d.dates, map: d.map }; applyDefaultWho(); renderCetak();
    }).withFailureHandler(e => alert('Gagal memuat arsip: ' + e.message)).getArsipData(v);
  }
  function cetakNames() {
    const set = {};
    CET.dates.forEach(t => { const d = CET.map[t]; if (!d) return;
      (d.asis||[]).forEach(a => { if (a.perawat) set[a.perawat] = 1; });
      (d.resep||[]).forEach(r => r.isi.forEach(n => { if (n) set[n] = 1; }));
      (d.libur||[]).forEach(n => { if (n) set[n] = 1; });
    });
    return Object.keys(set).sort();
  }
  function onCetWho(v) { CET_WHO = v; const p = document.getElementById('cetPrev'); if (p) p.innerHTML = buildJadwalHTML(CET_WHO); }
  function renderCetak() {
    const m = document.getElementById('main');
    const names = cetakNames();
    let popt = '';
    if (CET_LIVE) popt += '<option value="live"' + (CET_PER === 'live' ? ' selected' : '') + '>Periode aktif (live) — ' + esc(CET_LIVE.mulai) + ' s.d. ' + esc(CET_LIVE.akhir) + '</option>';
    CET_ARSIP.forEach(a => { popt += '<option value="' + esc(a.periode) + '"' + (CET_PER === a.periode ? ' selected' : '') + '>Final: ' + esc(a.periode) + ' · ' + esc(a.final) + '</option>'; });
    if (!popt) popt = '<option value="live">(tidak ada data)</option>';
    const lockWho = (CTX.peran === 'Viewer' && CET_WHO);
    let opt = '<option value="">— Semua (jadwal lengkap klinik) —</option>';
    names.forEach(n => { opt += '<option value="' + esc(n) + '"' + (n === CET_WHO ? ' selected' : '') + '>' + esc(n) + '</option>'; });
    m.innerHTML =
      jdwTabBar() +
      '<div class="card"><h2>Jadwal Karyawan · List View</h2>' +
      '<div class="muted" style="margin-bottom:8px">Pilih periode (termasuk bulan yang sudah difinalisasi), lalu "Semua" untuk jadwal lengkap klinik atau nama staf untuk jadwal pribadi.</div>' +
      '<label>Periode</label><select id="cetPer" onchange="onCetPeriode(this.value)">' + popt + '</select>' +
      '<label style="margin-top:8px;display:block">Tampilkan jadwal untuk</label><select id="cetWho" onchange="onCetWho(this.value)"' + (lockWho ? ' disabled' : '') + '>' + opt + '</select>' +
      (lockWho ? '<div class="muted" style="font-size:11px;margin-top:4px">Anda masuk sebagai ' + esc(CTX.nama) + ' — menampilkan jadwal pribadi Anda.</div>' : '') +
      '<button class="act" onclick="cetakSekarang()" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px">' + svgPx('cetak', 18) + 'Cetak / Simpan PDF</button></div>' +
      '<div class="card"><div id="cetPrev">' + buildJadwalHTML(CET_WHO) + '</div></div>';
  }
  function buildJadwalHTML(who) {
    const low = who ? who.toLowerCase() : '';
    const head = '<div class="jf-head"><div class="jf-title">' + (who ? 'Jadwal: ' + esc(who) : 'Jadwal Lengkap Klinik') + '</div>' +
      '<div class="jf-sub">Periode ' + esc(CET.mulai) + ' s.d. ' + esc(CET.akhir) + ' · Status: ' + esc((CTX && CTX.status) || '-') + '</div></div>';
    if (!who) {
      let h = head;
      CET.dates.forEach(t => { const d = CET.map[t]; if (!d) return;
        const asis = (d.asis||[]).slice().sort((a, b) => (a.shift === b.shift ? (a.dokter < b.dokter ? -1 : 1) : (a.shift === 'Pagi' ? -1 : 1)));
        let rows = '';
        asis.forEach(a => { rows += '<tr><td>' + esc(a.shift) + '</td><td>' + esc(a.dokter) + ' <span class="jmut">(' + esc(a.spes) + ')</span></td><td>' + (a.perawat ? esc(a.perawat) : '<span class="jmut">— kosong —</span>') + '</td></tr>'; });
        const rcpP = ((d.resep||[]).find(r => r.shift === 'Pagi') || { isi: [] }).isi;
        const rcpS = ((d.resep||[]).find(r => r.shift === 'Siang') || { isi: [] }).isi;
        h += '<div class="hari"><div class="hh">' + esc(d.hari) + ', ' + esc(t) + (d.isWeekend ? '<span class="wk">weekend</span>' : '') + '</div>' +
          (asis.length ? '<table><tr><th>Shift</th><th>Dokter (Spesialisasi)</th><th>Perawat</th></tr>' + rows + '</table>' : '<div class="jmut">Tidak ada praktik dokter.</div>') +
          '<div class="ln"><b>Resepsionis</b> — Pagi: ' + (rcpP.length ? esc(rcpP.join(', ')) : '—') + ' · Siang: ' + (rcpS.length ? esc(rcpS.join(', ')) : '—') + '</div>' +
          '<div class="ln"><b>Libur</b>: ' + ((d.libur && d.libur.length) ? esc(d.libur.join(', ')) : '—') + '</div></div>';
      });
      return h;
    }
    let nAsis = 0, nRcp = 0, nLibur = 0, nLong = 0, rows = '';
    CET.dates.forEach(t => { const d = CET.map[t]; if (!d) return;
      const items = []; let pagi = false, siang = false;
      (d.asis||[]).forEach(a => { if (a.perawat && a.perawat.toLowerCase() === low) { items.push({ shift: a.shift, txt: 'Asistensi ' + a.dokter + ' (' + a.spes + ')' }); nAsis++; if (a.shift === 'Pagi') pagi = true; else siang = true; } });
      (d.resep||[]).forEach(r => { if (r.isi.some(n => n.toLowerCase() === low)) { items.push({ shift: r.shift, txt: 'Jaga resepsionis' }); nRcp++; if (r.shift === 'Pagi') pagi = true; else siang = true; } });
      const libur = (d.libur||[]).some(n => n.toLowerCase() === low);
      if (libur) nLibur++;
      if (pagi && siang) nLong++;
      if (!items.length && !libur) return;
      let cell;
      if (libur && !items.length) cell = '<span class="lib">LIBUR</span>';
      else { cell = items.sort((a, b) => a.shift === 'Pagi' ? -1 : 1).map(x => '<span class="pill">' + esc(x.shift) + '</span>' + esc(x.txt)).join('<br>'); if (libur) cell += '<br><span class="lib">LIBUR</span>'; }
      rows += '<tr><td>' + esc(t) + '</td><td>' + esc(d.hari) + '</td><td>' + cell + '</td></tr>';
    });
    const sum = '<div class="jf-sum">Ringkasan: ' + nAsis + ' asistensi · ' + nRcp + ' shift resepsionis · ' + nLong + ' longshift · ' + nLibur + ' libur</div>';
    return head + sum + '<table><tr><th>Tanggal</th><th>Hari</th><th>Tugas</th></tr>' + (rows || '<tr><td colspan="3" class="jmut">Tidak ada jadwal untuk nama ini.</td></tr>') + '</table>';
  }
  function cetakSekarang() {
    const judul = CET_WHO ? ('Jadwal ' + CET_WHO) : 'Jadwal Lengkap Klinik';
    const css = 'body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:24px}' + JDW_CSS.replace(/JTBL/g, 'table') + '@media print{.hari{border-color:#bbb}}';
    const win = window.open('', '_blank');
    if (!win) { alert('Popup diblokir. Izinkan popup untuk mencetak.'); return; }
    win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + judul.replace(/</g,'') + '</title><style>' + css + '</style></head><body>' + buildJadwalHTML(CET_WHO) + '</body></html>');
    win.document.close(); win.focus();
    setTimeout(() => { win.print(); }, 350);
  }

  // ---- Jadwal Karyawan: sub-tab Kalender / List ----

  function jdwSwitch(tab){ JDW_TAB=tab; go('jadwal'); }
  function viewJadwal(m){

  // ---- Asistensi (editable) ----
  // ---- Kalender gabungan ----
  let KAL = null, KAL_DAY = null, KAL_MODE = 'monthly', KAL_CURSOR = null, KAL_STAF = '';
  function parseTgl(t) { const m = String(t).match(/(\d+)\/(\d+)\/(\d+)/); return m ? new Date(+m[3], +m[2]-1, +m[1]) : null; }
  function fmtTgl(d) { return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear(); }
  function dayIssues(day) { let k=0,r=0; day.asis.forEach(a=>{ if(!a.perawat)k++; }); day.resep.forEach(x=>{ if(x.isi.length<x.minimal)r++; }); return {k:k, r:r, total:k+r}; }
  function dotsHtml(day){ const aC=day.asis.length; const rSet={}; day.resep.forEach(r=>r.isi.forEach(n=>rSet[n]=1)); const rC=Object.keys(rSet).length; const lC=day.libur.length; const iss=dayIssues(day);
    return (aC?'<span class="cdot a">'+aC+'</span>':'')+(rC?'<span class="cdot r">'+rC+'</span>':'')+(lC?'<span class="cdot l">'+lC+'</span>':'')+(iss.total?'<span class="cdot warn" title="'+iss.k+' asisten kosong, '+iss.r+' resepsionis kurang">!</span>':''); }
  function dayStats(day){
    const asisTotal=day.asis.length; let asisIsi=0; day.asis.forEach(a=>{ if(a.perawat) asisIsi++; });
    let rcpButuh=0, rcpIsi=0; day.resep.forEach(r=>{ rcpButuh+=(+r.minimal||0); rcpIsi+=r.isi.length; });
    const lsP=Object.keys(longshiftPrw(day.asis)).length;
    const lsR=Object.keys(longshiftRcp(day.resep)).length;
    const rcpKurang=day.resep.reduce((s,r)=>s+Math.max(0,(+r.minimal||0)-r.isi.length),0);
    const kosong=(asisTotal-asisIsi)+rcpKurang;
    return { asisTotal, asisIsi, rcpButuh, rcpIsi, lsP, lsR, libur:day.libur.length, kosong };
  }
  function statsHtml(day){
    const s=dayStats(day); let h='<div class="cstats">';
    if(s.asisTotal) h+='<span class="cs a'+(s.asisIsi<s.asisTotal?' bad':'')+'" title="Asistensi terisi / kebutuhan">PG '+s.asisIsi+'/'+s.asisTotal+'</span>';
    if(s.rcpButuh||s.rcpIsi) h+='<span class="cs r'+(s.rcpIsi<s.rcpButuh?' bad':'')+'" title="Resepsionis terisi / kebutuhan">R '+s.rcpIsi+'/'+s.rcpButuh+'</span>';
    if(s.lsP) h+='<span class="cs ls" title="Longshift perawat">⇅P '+s.lsP+'</span>';
    if(s.lsR) h+='<span class="cs lsr" title="Longshift resepsionis">⇅R '+s.lsR+'</span>';
    if(s.libur) h+='<span class="cs l" title="Jumlah libur">L '+s.libur+'</span>';
    if(s.kosong) h+='<span class="cs k" title="Slot belum terisi (asistensi + resepsionis)">'+s.kosong+' kosong</span>';
    return h+'</div>';
  }
  // Isi sel kalender saat difilter per karyawan: status orang tsb di hari itu
  function stafOff(day, nm){
    if (!nm) return false;
    const low = String(nm).toLowerCase();
    if ((day.libur||[]).some(n=>String(n).toLowerCase()===low)) return false; // libur bukan "off"
    const kerja = day.asis.some(a=>a.perawat&&a.perawat.toLowerCase()===low) || day.resep.some(r=>r.isi.some(n=>String(n).toLowerCase()===low));
    return !kerja;
  }
  function statsHtmlStaf(day, nm){
    const low = String(nm).toLowerCase();
    if ((day.libur||[]).some(n => String(n).toLowerCase()===low)) return '<div class="cstats"><span class="cs l">Libur</span></div>';
    const parts = [];
    day.asis.forEach(a => { if (a.perawat && a.perawat.toLowerCase()===low) parts.push('<span class="cs a" title="Asistensi '+a.shift+' — '+esc(a.dokter)+'">Asistensi '+a.shift+'</span>'); });
    day.resep.forEach(r => { if (r.isi.some(n=>String(n).toLowerCase()===low)) parts.push('<span class="cs r" title="Resepsionis '+r.shift+'">Resepsionis '+r.shift+'</span>'); });
    if (!parts.length) return '<div class="cstats"><span class="muted" style="font-size:10px">Tidak bertugas</span></div>';
    return '<div class="cstats">'+parts.join('')+'</div>';

  function setStafFilter(nm){ KAL_STAF = nm || ''; renderKalender(); }
  function stafFilterHtml(){

      (KAL_STAF ? '<button onclick="setStafFilter(\'\')" style="font-size:12px;padding:4px 10px;border:1px solid var(--border,#d0d5dd);border-radius:8px;cursor:pointer;background:transparent;color:inherit">Reset</button>' : '')+'</div>';

  function viewKalender(m) { m.innerHTML = '<div class="loading">Memuat kalender…</div>'; muatKalender(); }
  function muatKalender(cb) {
    google.script.run.withSuccessHandler(res => {
      if (!res.ok) { document.getElementById('main').innerHTML = '<div class="card">'+esc(res.pesan)+'<br><span class="muted">Buka ⚡ Aksi → Generate untuk membuat jadwal.</span></div>'; return; }

  function setMode(mode) { KAL_MODE = mode; renderKalender(); }
  function clampCursor(d) { const first=parseTgl(KAL.dates[0]), last=parseTgl(KAL.dates[KAL.dates.length-1]);
    if (d<first) KAL_CURSOR=KAL.dates[0]; else if (d>last) KAL_CURSOR=KAL.dates[KAL.dates.length-1]; else KAL_CURSOR=fmtTgl(d); }
  function moveDay(delta){ const c=parseTgl(KAL_CURSOR); c.setDate(c.getDate()+delta); clampCursor(c); renderKalender(); }
  function moveWeek(delta){ const c=parseTgl(KAL_CURSOR); c.setDate(c.getDate()+delta*7); clampCursor(c); renderKalender(); }

  // Panel blocker di Mapping Staff — bantu SPV memperbaiki manual sebelum finalisasi.
  function kalBlockerPanel() {
    const n = KAL.blocker || 0;
    if (!n) return '<div class="card !py-2" style="border-left:4px solid #16a34a"><b style="color:#16a34a">✅ Tidak ada blocker</b> <span class="muted">— jadwal siap difinalkan.</span></div>';
    const rinci = KAL.blockerRinci || [];
    const namaKel = { N: 'Perawat (N)', A: 'Asistensi (A)', R: 'Resepsionis (R)', D: 'Data & Operasional' };
    let body = '';
    ['N', 'A', 'R', 'D'].forEach(kk => {
      const arr = rinci.filter(x => (x.keluarga || 'D') === kk);
      if (!arr.length) return;
      body += '<div style="font-weight:600;font-size:12px;margin:8px 0 2px">▸ ' + namaKel[kk] + ' <span class="muted" style="font-weight:400">(' + arr.length + ')</span></div>';
      arr.forEach(t => { body += '<div style="display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px solid var(--border,#eee)">' +
        '<span style="flex:none;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:#fde8e8;color:#b02a2a">' + esc(t.kode) + '</span>' +
        '<div style="flex:1;font-size:12px;line-height:1.4"><b>' + esc(t.lokasi) + '</b>' + (t.detail ? ' — ' + esc(t.detail) : '') + '</div></div>'; });
    });
    return '<div class="card" style="border-left:4px solid #c5221f">' +
      '<details open><summary style="cursor:pointer;font-weight:700;color:#c5221f">🔴 ' + n + ' blocker — perbaiki manual agar bisa FINAL</summary>' +
      '<div class="muted" style="font-size:11px;margin:5px 0 4px">Klik tanggal untuk mengedit slot. Hari yang muncul di blocker diberi <b style="color:#dc2626">outline merah</b> di kalender bawah.</div>' +
      body + '</details></div>';
  }
  function renderKalender() {
    const seg = '<div class="seg3">' +
      '<button class="'+(KAL_MODE==='monthly'?'on':'')+'" onclick="setMode(\'monthly\')">Bulanan</button>' +
      '<button class="'+(KAL_MODE==='weekly'?'on':'')+'" onclick="setMode(\'weekly\')">Mingguan</button>' +
      '<button class="'+(KAL_MODE==='daily'?'on':'')+'" onclick="setMode(\'daily\')">Harian</button></div>';
    const legenda = '<div class="card !py-2"><div class="muted" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">' +
      '<b style="font-weight:600">Keterangan:</b>' +
      '<span><span class="cs a">PG</span> asistensi terisi/kebutuhan</span>' +
      '<span><span class="cs r">R</span> resepsionis terisi/kebutuhan</span>' +
      '<span><span class="cs ls">⇅P</span> longshift perawat</span>' +
      '<span><span class="cs lsr">⇅R</span> longshift resepsionis</span>' +
      '<span><span class="cs l">L</span> libur</span>' +
      '<span><span class="cs k">kosong</span> slot belum terisi</span>' +
      '</div></div>';
    const printBtn = '<button class="act sec no-print" style="width:auto;padding:6px 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px;margin:0" onclick="window.print()">'+svgPx('cetak',16)+'Print</button>';
    let html = jdwTabBar();
    html += '<div class="card"><div class="flex items-center justify-between flex-wrap gap-2 mb-1"><h2 style="margin:0">Jadwal Karyawan · Kalender</h2><div class="flex items-center gap-2 flex-wrap no-print">'+seg+printBtn+'</div></div>' +
      '<span class="muted">Periode '+esc(KAL.mulai)+' – '+esc(KAL.akhir)+'</span>' + stafFilterHtml() + '</div>';
    html += kalBlockerPanel(); // panel blocker di atas kalender
    html += legenda;
    if (KAL_MODE==='monthly') html += monthGrid();
    else if (KAL_MODE==='weekly') html += weekView();
    else html += dayView();
    document.getElementById('main').innerHTML = html;
  }
  // Kumpulan tanggal (dd/MM/yyyy) yang muncul di blocker → utk outline merah di kalender.
  function blkDates() {
    const set = new Set();
    (KAL.blockerRinci || []).forEach(x => {
      const m = ((x.lokasi || '') + ' ' + (x.detail || '')).match(/\b\d{2}\/\d{2}\/\d{4}\b/g);
      if (m) m.forEach(d => set.add(d));
    });
    return set;
  }
  // Blocker yang menunjuk (tgl, shift, dokter) — dari lokasi "Grup dd/mm/yyyy|Shift|Dokter".
  function blkForDayShift(tgl, sh) {
    const out = [];
    (KAL.blockerRinci || []).forEach(x => {
      const m = String(x.lokasi || '').match(/^Grup\s+(\d{2}\/\d{2}\/\d{4})\|([^|]+)\|(.+)$/);
      if (m && m[1] === tgl && m[2] === sh) out.push({ dokter: m[3].trim(), kode: x.kode, detail: x.detail });
    });
    return out;
  }
  // Penanda 🔴 utk tab shift bila shift itu punya blocker (grup dokter).
  function shiftBlkMark(tgl, sh) { return blkForDayShift(tgl, sh).length ? ' 🔴' : ''; }
  function monthGrid() {
    const blk = blkDates();
    let html = '<div class="card !p-2"><div class="cal">';
    ['Sen','Sel','Rab','Kam','Jum','Sab','Min'].forEach(h => html += '<div class="cal-h">'+h+'</div>');
    const first = parseTgl(KAL.dates[0]); const lead = (first.getDay()+6)%7;
    for (let i=0;i<lead;i++) html += '<div class="cal-cell empty"></div>';
    KAL.dates.forEach(t => {
      const day = KAL.map[t]; const d = parseTgl(t); const iss = dayIssues(day);
      html += '<div class="cal-cell'+(day.isWeekend?' wknd':'')+(iss.total?' warn':'')+(blk.has(t)?' blk':'')+(KAL_STAF&&stafOff(day,KAL_STAF)?' staf-off':'')+'" onclick="openHari(\''+t+'\')"><div class="cal-num" style="display:flex;align-items:center;justify-content:space-between;gap:4px"><span>'+d.getDate()+(blk.has(t)?' <span class="cellwarn">!</span>':(iss.total?' <span class="cellwarn">!</span>':''))+'</span>'+sugBtn(t)+'</div>'+(KAL_STAF?statsHtmlStaf(day,KAL_STAF):statsHtml(day))+'</div>';
    });
    return html + '</div></div>';
  }
  // Legenda ikon staf — dipakai tampilan Harian, Mingguan & drawer.
  function legendaIkon() {
    return '<div style="font-size:11px;color:#94a3b8;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;margin:8px 2px 2px;padding-bottom:7px;border-bottom:1px solid var(--border,#eee)">' +
      '<span style="display:inline-flex;align-items:center;gap:3px">'+levelIc('Gold')+'Gold</span>' +
      '<span style="display:inline-flex;align-items:center;gap:3px">'+levelIc('Silver')+'Silver</span>' +
      '<span style="display:inline-flex;align-items:center;gap:3px">'+katIc('New')+'New</span>' +
      '<span style="display:inline-flex;align-items:center;gap:3px">'+katIc('Existing')+'Existing</span>' +
      '<span style="display:inline-flex;align-items:center;gap:3px">'+lsBadge()+'longshift</span>' +
      '<span style="width:100%;font-weight:600;margin-top:2px">angka di kanan nama = total asistensi · longshift⇅ · libur</span>' +
    '</div>';
  }
  // Tampilan Mingguan: 7 kolom, tiap kolom = tampilan Harian versi ringkas.
  // Shift mengikuti tab Pagi/Siang (satu tab untuk seluruh minggu, sama seperti Harian).
  function weekView() {
    const blk = blkDates();
    const bisaEdit = CTX.peran==='Admin' || CTX.peran==='SPV';
    const cur = parseTgl(KAL_CURSOR); const mon = new Date(cur); mon.setDate(cur.getDate()-((cur.getDay()+6)%7));
    const hn = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
    let html = '<div class="card"><div class="flex items-center justify-between mb-2"><button class="navbtn" onclick="moveWeek(-1)">◀</button><span class="font-semibold text-[13px]">Minggu '+fmtTgl(mon)+'</span><button class="navbtn" onclick="moveWeek(1)">▶</button></div>';
    html += '<div class="seg2"><button class="'+(KAL_SHIFT==='Pagi'?'on':'')+'" onclick="switchShift(\'Pagi\')">☀️ Pagi</button>'+
      '<button class="'+(KAL_SHIFT==='Siang'?'on':'')+'" onclick="switchShift(\'Siang\')">🌤️ Siang</button></div>';
    html += legendaIkon();
    html += '<div class="wkwrap"><div class="wkgrid">';
    for (let i=0;i<7;i++){
      const d=new Date(mon); d.setDate(mon.getDate()+i); const t=fmtTgl(d); const day=KAL.map[t];
      if (!day){
        html += '<div class="wk-col disabled"><div class="wk-head"><span>'+hn[i]+' '+d.getDate()+'</span></div><div class="wk-empty">di luar periode</div></div>';
        continue;
      }
      const iss=dayIssues(day);
      html += '<div class="wk-col'+(iss.total?' warn':'')+(blk.has(t)?' blk':'')+(KAL_STAF&&stafOff(day,KAL_STAF)?' staf-off':'')+'">'+
        '<div class="wk-head" title="Klik untuk buka detail hari" onclick="openHari(\''+t+'\')"><span>'+hn[i]+', '+esc(t)+shiftBlkMark(t,KAL_SHIFT)+((blk.has(t)||iss.total)?' <span class="cellwarn">!</span>':'')+'</span>'+sugBtn(t)+'</div>'+
        '<div class="wk-body">'+(KAL_STAF?statsHtmlStaf(day,KAL_STAF):'')+buildShiftSections(day, KAL_SHIFT, bisaEdit)+'</div></div>';
    }
    return html + '</div></div></div>';
  }
  function dayView() {
    const day = KAL.map[KAL_CURSOR]; if (!day) return '<div class="card">-</div>';
    const bisaEdit = CTX.peran==='Admin' || CTX.peran==='SPV';
    let html = '<div class="card"><div class="flex items-center justify-between mb-1"><button class="navbtn" onclick="moveDay(-1)">◀</button><span class="font-semibold text-[14px]">'+esc(day.hari)+', '+esc(KAL_CURSOR)+'</span><button class="navbtn" onclick="moveDay(1)">▶</button></div>';
    html += '<div class="seg2"><button class="'+(KAL_SHIFT==='Pagi'?'on':'')+'" onclick="switchShift(\'Pagi\')">☀️ Pagi'+shiftBlkMark(day.tanggal,'Pagi')+'</button><button class="'+(KAL_SHIFT==='Siang'?'on':'')+'" onclick="switchShift(\'Siang\')">🌤️ Siang'+shiftBlkMark(day.tanggal,'Siang')+'</button></div>';
    html += legendaIkon();
    html += buildShiftSections(day, KAL_SHIFT, bisaEdit);
    return html + '</div>';
  }
  // Ikon kecil untuk staf
  function icSm(kind){
    if (kind==='prw') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
    if (kind==='rcp') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-500"><path d="M3 21h18M5 21V10a7 7 0 0 1 14 0v11"/><circle cx="12" cy="7" r="1"/></svg>';
    if (kind==='free') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-teal-500"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-500"><path d="M12 2v3M5.6 5.6l2 2M2 13h3M22 13h-3M18.4 5.6l-2 2M12 8a5 5 0 0 1 5 5H7a5 5 0 0 1 5-5zM12 13v9"/></svg>';
  }
  // Ikon terpisah untuk Level & Kategori (lebih sederhana daripada teks)
  function svgMini(paths, cls){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="'+cls+'" style="width:14px;height:14px;display:inline;vertical-align:-2px;flex:none">'+paths+'</svg>'; }
  function levelIc(lv){
    if (lv==='Gold') return '<span title="Level Gold">'+svgMini('<path d="M2 18h20M4 8l4 4 4-6 4 6 4-4-2 10H6z"/>','text-amber-500')+'</span>';
    if (lv==='Silver') return '<span title="Level Silver">'+svgMini('<circle cx="12" cy="9" r="6"/><path d="M9 14.5L7.5 21 12 18l4.5 3-1.5-6.5"/>','text-slate-400')+'</span>';
    return '';
  }
  function katIc(kat){
    if (kat==='New') return '<span title="Perawat New (fresh)">'+svgMini('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>','text-blue-500')+'</span>';
    if (kat==='Existing') return '<span title="Perawat Existing">'+svgMini('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M15 11l2 2 4-4"/>','text-emerald-500')+'</span>';
    return '';
  }
  function lsBadge(){ return '<span class="lsflag" title="Longshift: bertugas pagi & siang">⇅</span>'; }
  function longshiftPrw(asis){ const p=new Set(),s=new Set(); asis.forEach(a=>{ if(!a.perawat)return; const n=a.perawat.toLowerCase(); if(a.shift==='Pagi')p.add(n); else if(a.shift==='Siang')s.add(n); }); const o={}; p.forEach(n=>{ if(s.has(n)) o[n]=true; }); return o; }
  function longshiftRcp(resep){ const p=new Set(),s=new Set(); resep.forEach(r=>{ r.isi.forEach(n=>{ const k=n.toLowerCase(); if(r.shift==='Pagi')p.add(k); else if(r.shift==='Siang')s.add(k); }); }); const o={}; p.forEach(n=>{ if(s.has(n)) o[n]=true; }); return o; }
  // Tooltip statistik periode per staf (hover nama)
  function stafTip(nama){ const s=(KAL&&KAL.staf)?KAL.staf[String(nama).toLowerCase()]:null; if(!s) return String(nama);
    const lbl = s.peran==='Resepsionis' ? 'Total shift' : 'Total asistensi';
    return nama+' — '+lbl+': '+(s.total||0)+' · Longshift: '+(s.longshift||0)+' · Libur: '+(s.libur||0); }
  function namaTip(nama){ return '<span class="staftip" title="'+esc(stafTip(nama))+'">'+esc(nama)+'</span>'; }
  // Badge stat ringkas (selalu tampil): total asistensi · longshift · libur (periode)
  function statMini(nama){ const s=(KAL&&KAL.staf)?KAL.staf[String(nama).toLowerCase()]:null; if(!s) return '';
    return '<span title="'+esc(stafTip(nama))+'" style="margin-left:auto;flex:none;font-size:10px;color:#94a3b8;font-weight:600;white-space:nowrap;letter-spacing:.2px">'+(s.total||0)+' · '+(s.longshift||0)+'⇅ · '+(s.libur||0)+'L</span>'; }
  // Baris teks kecil di kartu chip: total asistensi/shift · longshift · libur (periode)
  function statCard(nama){ const s=(KAL&&KAL.staf)?KAL.staf[String(nama).toLowerCase()]:null; if(!s) return '';
    const lbl = s.peran==='Resepsionis' ? 'shift' : 'asistensi';
    return (s.total||0)+' '+lbl+' · '+(s.longshift||0)+' longshift · '+(s.libur||0)+' libur'; }

  let KAL_SHIFT = 'Pagi';
  function openHari(t) { KAL_DAY = t; KAL_SHIFT = 'Pagi'; renderDrawer(); document.getElementById('drawerBg').classList.add('show'); }
  function switchShift(sh) {
    KAL_SHIFT = sh;
    if (document.getElementById('drawerBg').classList.contains('show')) renderDrawer();
    else renderKalender();
  }
  function tutupDrawer(e) { if (!e || e.target.id === 'drawerBg') document.getElementById('drawerBg').classList.remove('show'); }
  // Aksi: sarankan asistensi untuk 1 hari (seadil mungkin, patuh aturan)
  function suggestAsisHari(t) {
    const tgl = t || KAL_DAY; if (!tgl) return;
    overlay(true, 'Menyusun saran asistensi ' + tgl + '…');
    google.script.run.withSuccessHandler(res => {
      overlay(false);
      if (!res || !res.ok) { alert((res && res.pesan) || 'Gagal menyusun saran.'); return; }
      muatKalender(() => { if (document.getElementById('drawerBg').classList.contains('show')) renderDrawer(); });
    }).withFailureHandler(e => { overlay(false); alert('Error: ' + e.message); }).suggestAsistensiHariWeb(tgl);
  }
  // Tombol ikon "suggest" di sel kalender (Admin/SPV) — tidak membuka detail
  function sugBtn(t) {
    if (!(CTX.peran === 'Admin' || CTX.peran === 'SPV')) return '';
    return '<button class="cal-sug" title="Suggest asistensi hari ini (isi slot kosong seadil mungkin)" ' +
      'onclick="event.stopPropagation();suggestAsisHari(\'' + t + '\')">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2M15 10V8M11.5 6.5h-2M20.5 6.5h-2M18 12l3 3-9 9-3-3zM14 8l2 2"/><path d="M4 4l1.5 1.5M6 3l.7 1.7"/></svg></button>';
  }
  function renderDrawer() {
    const day = KAL.map[KAL_DAY]; if (!day) return;
    const bisaEdit = CTX.peran === 'Admin' || CTX.peran === 'SPV';
    let html = '<div class="drawer-head"><h3 style="margin:0">'+esc(day.hari)+', '+esc(KAL_DAY)+'</h3><button class="themebtn" onclick="tutupDrawer()">✕</button></div>';
    html += '<div class="seg2"><button class="'+(KAL_SHIFT==='Pagi'?'on':'')+'" onclick="switchShift(\'Pagi\')">☀️ Pagi'+shiftBlkMark(day.tanggal,'Pagi')+'</button><button class="'+(KAL_SHIFT==='Siang'?'on':'')+'" onclick="switchShift(\'Siang\')">🌤️ Siang'+shiftBlkMark(day.tanggal,'Siang')+'</button></div>';
    html += legendaIkon();
    html += buildShiftSections(day, KAL_SHIFT, bisaEdit);
    document.getElementById('drawer').innerHTML = html;
  }
  // Bagian per-shift (asistensi + resepsionis + libur) — dipakai drawer & tampilan Harian
  function buildShiftSections(day, sh, bisaEdit) {
    const lsPrw = longshiftPrw(day.asis);
    const lsRcp = longshiftRcp(day.resep);
    let html = '';
    // Asistensi
    const rows = day.asis.filter(a => a.shift === sh);
    const kosongA = rows.filter(a => !a.perawat).length;
    const blkGrp = {}; const blkList = blkForDayShift(day.tanggal, sh);
    blkList.forEach(b => { (blkGrp[b.dokter] = blkGrp[b.dokter] || []).push(b); });
    html += '<div class="det-sec"><div class="det-title">'+icSm('prw')+' Asistensi '+sh+(blkList.length?' <span class="blkpill">🔴 '+blkList.length+' blocker</span>':'')+'</div>';
    if (kosongA) html += '<div class="warnbox">⚠ '+kosongA+' slot asisten belum terisi</div>';
    if (!rows.length) html += '<div class="muted">Tidak ada jadwal.</div>';
    else {
      const docs = [];
      rows.forEach(r => { let dc = docs.find(x => x.nama===r.dokter && x.spes===r.spes); if (!dc){ dc={nama:r.dokter,spes:r.spes,slots:[]}; docs.push(dc);} dc.slots.push(r); });
      docs.forEach(dc => {
        const adaKosong = dc.slots.some(s => !s.perawat);
        const terisi = dc.slots.filter(s => s.perawat).length;
        const chips = dc.slots.map(s => {
          const f = !!s.perawat;
          if (!f) return bisaEdit ? '<button class="pchip empty" onclick="editSlot('+s.baris+')">+ pilih</button>' : '<span class="pchip empty">—</span>';
          const ls = lsPrw[s.perawat.toLowerCase()] ? lsBadge() : '';
          const act = bisaEdit ? ('<span class="chipact" title="Ganti perawat" onclick="editSlot('+s.baris+')">'+IC_EDIT+'</span>'+
            '<span class="chipact chipdel" title="Hapus perawat" onclick="hapusAsis('+s.baris+')">'+IC_DEL+'</span>') : '';
          return '<span class="pchip filled pchip-card"><span class="pchip-top">'+namaTip(s.perawat)+levelIc(s.perawatLevel)+katIc(s.perawatKat)+ls+act+'</span>'+
            '<span class="pchip-sub">'+esc(statCard(s.perawat))+'</span></span>';
        }).join('');
        const gblk = blkGrp[dc.nama];
        html += '<div class="docrow'+(adaKosong?' warn':'')+(gblk?' blk':'')+'"><div class="docinfo"><div class="docname">'+esc(dc.nama)+'</div><div class="docspes">'+esc(dc.spes)+' · butuh '+dc.slots.length+' asisten ('+terisi+'/'+dc.slots.length+' terisi)</div>'+(gblk?'<div class="blktag">'+gblk.map(b=>'['+esc(b.kode)+'] '+esc(b.detail||b.kode)).join(' · ')+'</div>':'')+'</div><div class="chips">'+chips+'</div></div>';
      });
    }
    html += '</div>';
    // Resepsionis
    const resep = day.resep.filter(r => r.shift === sh);
    html += '<div class="det-sec"><div class="det-title">'+icSm('rcp')+' Resepsionis '+sh+'</div>';
    if (!resep.length) html += '<div class="muted">Tidak ada.</div>';
    else resep.forEach(r => {
      const kurang = r.isi.length < r.minimal;
      let chipsHtml;
      if (bisaEdit && r.slots) {
        chipsHtml = r.slots.map(sl => {
          if (!sl.nama) return '<button class="pchip empty" onclick="editResepSlot('+r.baris+','+sl.c+')">+ pilih</button>';
          const si=(KAL.staf||{})[sl.nama.toLowerCase()]; const rlv=si?levelIc(si.level):'';
          const ls = lsRcp[sl.nama.toLowerCase()] ? lsBadge() : '';
          return '<span class="pchip filled pchip-card"><span class="pchip-top">'+namaTip(sl.nama)+rlv+ls+
            '<span class="chipact" title="Ganti resepsionis" onclick="editResepSlot('+r.baris+','+sl.c+')">'+IC_EDIT+'</span>'+
            '<span class="chipact chipdel" title="Hapus resepsionis" onclick="hapusResep('+r.baris+','+sl.c+')">'+IC_DEL+'</span></span>'+
            '<span class="pchip-sub">'+esc(statCard(sl.nama))+'</span></span>';
        }).join('');
      } else if (r.isi.length) {
        chipsHtml = r.isi.map(n => { const ls = lsRcp[n.toLowerCase()] ? lsBadge() : ''; const si=(KAL.staf||{})[n.toLowerCase()]; const rlv=si?levelIc(si.level):''; return '<span class="pchip filled pchip-card"><span class="pchip-top">'+namaTip(n)+rlv+ls+'</span><span class="pchip-sub">'+esc(statCard(n))+'</span></span>'; }).join('');
      } else chipsHtml = '<span class="pchip empty" style="cursor:default">—</span>';
      html += '<div class="docrow'+(kurang?' warn':'')+'"><div class="docinfo"><div class="docname">Resepsionis</div><div class="docspes">DU aktif '+r.du+' · minimal '+r.minimal+(kurang?' · <span style="color:var(--merah);font-weight:700">⚠ kurang '+(r.minimal-r.isi.length)+'</span>':'')+'</div></div><div class="chips">'+chipsHtml+'</div></div>';
    });
    html += '</div>';
    // Tersedia: perawat aktif yang TIDAK libur & belum ada jadwal apa pun hari ini (di atas)
    const assignedDay = {}; day.asis.forEach(a => { if (a.perawat) assignedDay[a.perawat.toLowerCase()] = 1; });
    const liburDay = {}; day.libur.forEach(n => liburDay[n.toLowerCase()] = 1);
    const stafAll = (KAL && KAL.staf) || {};
    const tersedia = Object.keys(stafAll).filter(k => stafAll[k].peran === 'Perawat' && !assignedDay[k] && !liburDay[k]).map(k => stafAll[k]).sort((a,b)=> a.nama<b.nama?-1:1);
    html += '<div class="det-sec"><div class="det-title">'+icSm('free')+' Tersedia — tidak libur & belum bertugas ('+tersedia.length+')</div>';
    if (tersedia.length) tersedia.forEach(x => html += '<div class="staffline">'+namaTip(x.nama)+levelIc(x.level)+katIc(x.kategori)+statMini(x.nama)+'</div>');
    else html += '<div class="muted">Tidak ada</div>';
    html += '</div>';

    // Libur (day-level) — dapat diedit Admin/SPV — di paling bawah

  function showTambahLibur(tgl) {
    const box = document.getElementById(pickLiburId(tgl)); if (!box) return;

    const day = KAL.map[tgl] || { libur: [] };

  // ---- Request Cuti (pola sama dengan Master Data) ----
  let cutiStaf = [];
