  let reqMode = 'cuti'; // 'cuti' | 'jaga'
  function isoDariTgl(s) { const m=String(s||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m?m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2):''; }
  function viewCuti(m) {
    const bReq = punyaModul('cuti'), bPref = punyaModul('pref');
    // pastikan reqMode termasuk sub-tab yang boleh
    const allowed = []; if (bReq) { allowed.push('jaga', 'cuti'); } if (bPref) allowed.push('pref');
    if (allowed.indexOf(reqMode) === -1) reqMode = allowed[0] || 'cuti';
    const seg = (id, mode, label) => '<button id="'+id+'" onclick="reqSwitch(\''+mode+'\')" class="seg flex items-center justify-center gap-1.5 py-2 rounded-lg text-[13px] font-medium transition">'+label+'</button>';
    let segs = '';
    if (bReq) segs += seg('rqJaga','jaga','Jadwal Jaga') + seg('rqCuti','cuti','Cuti / Libur');
    if (bPref) segs += seg('rqPref','pref','Preferensi Dokter');
    const nCol = (bReq ? 2 : 0) + (bPref ? 1 : 0);
    m.innerHTML =
      '<div class="card" style="padding:8px"><div class="grid gap-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl" style="grid-template-columns:repeat(' + Math.max(nCol, 1) + ',minmax(0,1fr))">' +
        segs +
      '</div></div>' +
      '<div id="reqBody"></div>';
    google.script.run.withSuccessHandler(list => { cutiStaf = list || []; }).webGetStaf();
    reqSwitch(reqMode);
  }
  function reqSwitch(mode) {
    // guard akses modul: alihkan ke sub-tab yang boleh
    if (mode === 'pref' && !punyaModul('pref')) mode = 'cuti';
    if ((mode === 'jaga' || mode === 'cuti') && !punyaModul('cuti')) mode = punyaModul('pref') ? 'pref' : mode;
    reqMode = mode;
    const base = 'seg flex items-center justify-center gap-1.5 py-2 rounded-lg text-[13px] font-medium transition ';
    const on = 'bg-white dark:bg-slate-900 text-brand shadow-sm', off = 'text-slate-500';
    [['rqJaga','jaga'],['rqCuti','cuti'],['rqPref','pref']].forEach(pair => { const el = document.getElementById(pair[0]); if (el) el.className = base + (mode===pair[1]?on:off); });
    const body = document.getElementById('reqBody'); if (!body) return;
    if (mode === 'pref') { viewPref(body); return; }
    body.innerHTML =
      '<div class="card"><h2 id="cJudul">Request Jadwal</h2>' +
      '<button class="act" id="cBtnTambah" onclick="showCutiTambah()" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:0">' + IC_PLUS + 'Tambah Request Baru</button>' +

    hideCutiForm();
    muatCuti();

  function renderCutiForm() {
    document.getElementById('cForm').innerHTML =
      '<label>Nama Staf *</label>' +
      '<input type="hidden" id="cNama">' +

  // Picker staf SVG (seragam dgn picker "Nilai" Preferensi Dokter): search + daftar ikon + legend.
  function renderCutiPickList() {
    const box = document.getElementById('cNamaList'); if (!box) return;
    const cur = document.getElementById('cNama') ? document.getElementById('cNama').value : '';
    const ql = (document.getElementById('cNamaSearch') ? document.getElementById('cNamaSearch').value : '').toLowerCase();
    const row = (idx, inner, sel) => '<div onclick="pickCuti(' + idx + ')" style="display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--border,#eee);' + (sel ? 'background:rgba(26,115,232,.14);font-weight:600;' : '') + '">' + inner + '</div>';
    let rows = '';
    cutiStaf.forEach((s, i) => {
      if (reqMode === 'jaga' && s.peran === 'Dokter') return; // jaga: hanya perawat & resepsionis
      if (ql && s.nama.toLowerCase().indexOf(ql) === -1 && (s.peran || '').toLowerCase().indexOf(ql) === -1) return;
      rows += row(i, levelIc(s.level) + katIc(s.kategori) + '<span>' + esc(s.nama) + '</span><span class="muted" style="margin-left:auto;font-size:11px">' + esc(s.peran) + '</span>', String(cur) === String(i));

    const pg = document.getElementById('cShiftPagi'), sg = document.getElementById('cShiftSiang');

      data.shift = arr.join(', ');

    const cb = res => { btn.disabled=false;

      } else { p.className='pesan err'; p.textContent=res.pesan; }

    const r = google.script.run.withSuccessHandler(cb).withFailureHandler(fail);

  let SARAN_ITEMS = [];
  function sarankanPerbaikan() {
    overlay(true, 'Menghitung saran…');

  // Terapkan SATU item saran (dipicu ikon ✅ pada barisnya).
  function terapkanItem(id) {
    const it = (SARAN_ITEMS || []).find(x => x.id === id);
    if (!it || !it.moves) return;
    const ic = document.getElementById('sic_' + id);
    if (ic) { ic.textContent = '⏳'; ic.onclick = null; ic.style.cursor = 'default'; }
    google.script.run.withSuccessHandler(res => {
      if (res && res.ok) {
        if (ic) { ic.textContent = '✔️'; ic.title = 'Sudah diterapkan'; }
        const row = document.getElementById('srow_' + id); if (row) row.style.opacity = '.45';
        refreshKesesuaianAksi(); // segarkan rekap blocker di bawah
      } else {
        if (ic) { ic.textContent = '⚠️'; ic.title = (res && res.pesan) || 'Gagal'; ic.style.cursor = 'pointer'; ic.onclick = function () { terapkanItem(id); }; }
      }
    }).withFailureHandler(e => { if (ic) { ic.textContent = '⚠️'; ic.title = 'Error: ' + e.message; ic.style.cursor = 'pointer'; ic.onclick = function () { terapkanItem(id); }; } }).terapkanSaranBlockerWeb(it.moves);
  }
  // Render saran per-ITEM sebagai tabel; tiap baris punya ikon ✅ sendiri.
  function saranRincianHtml(items) {
    if (!items || !items.length) return '';
    const grp = {}; items.forEach(it => { (grp[it.kat] || (grp[it.kat] = [])).push(it); });
    const thS = 'text-align:left;font-weight:600;opacity:.55;padding:1px 10px 3px 0;border-bottom:1px solid rgba(0,0,0,.12)';
    const tdS = 'padding:3px 10px 3px 0;white-space:nowrap;vertical-align:top';
    function kartu(kat, judul, cols) {
      const arr = grp[kat]; if (!arr || !arr.length) return null;
      const th = '<tr>' + cols.map(c => '<th style="' + thS + '">' + esc(c.h) + '</th>').join('') + '<th style="' + thS + ';text-align:center">Terapkan</th></tr>';
      const tr = arr.map((it, i) => '<tr id="srow_' + it.id + '" style="' + (i % 2 ? 'background:rgba(0,0,0,.03)' : '') + '">'
        + cols.map(c => '<td style="' + tdS + '">' + esc(c.f(it)) + '</td>').join('')
        + '<td style="' + tdS + ';text-align:center"><span id="sic_' + it.id + '" onclick="terapkanItem(\'' + it.id + '\')" title="Terapkan penyesuaian ini" style="cursor:pointer;font-size:15px">✅</span></td></tr>').join('');
      return pbBlok(judul, arr.length, '<table style="border-collapse:collapse;font-size:12px;width:100%">' + th + tr + '</table>');
    }
    const sec = [
      kartu('A-02', '🔁 Tukar untuk perbaiki A-02 (perawat New berdampingan)',
        [{ h: 'Tanggal', f: it => it.tgl }, { h: 'Shift', f: it => it.shift }, { h: 'Pertukaran', f: it => it.ket }, { h: 'Rincian', f: it => it.detail }]),
      kartu('A-04', '⏱️ Tambah longshift perawat (A-04)',
        [{ h: 'Tanggal', f: it => it.tgl }, { h: 'Shift', f: it => it.shift }, { h: 'Dokter', f: it => it.dokter || '-' }, { h: 'Penyesuaian', f: it => it.ket }]),
      kartu('R-07', '⏱️ Tambah longshift resepsionis (R-07)',
        [{ h: 'Tanggal', f: it => it.tgl }, { h: 'Shift', f: it => it.shift }, { h: 'Penyesuaian', f: it => it.ket }])
    ].filter(Boolean);
    if (!sec.length) return '';
    return '<div style="margin-top:10px">' + sec.join('') + '</div>';
  }
  // Render rincian perubahan auto-fix sebagai tabel per orang, dapat dilipat.
  function pbRincianHtml(rc) {
    if (!rc) return '';
    // arr → dikelompokkan per 'namaField', tiap orang jadi kartu + tabel kolom.
    function tabel(arr, namaField, cols) {
      const m = {}, urut = [];
      (arr || []).forEach(it => { const n = it[namaField]; if (!(n in m)) { m[n] = []; urut.push(n); } m[n].push(it); });
      return urut.map(n => {
        const th = '<tr>' + cols.map(c => '<th style="text-align:left;font-weight:600;opacity:.55;padding:1px 10px 3px 0;border-bottom:1px solid rgba(0,0,0,.12)">' + esc(c.h) + '</th>').join('') + '</tr>';
        const tr = m[n].map((it, i) => '<tr style="' + (i % 2 ? 'background:rgba(0,0,0,.03)' : '') + '">'
          + cols.map(c => '<td style="padding:2px 10px 2px 0;white-space:nowrap">' + esc(c.f(it)) + '</td>').join('') + '</tr>').join('');
        return '<div style="margin:6px 0 10px">'
          + '<div style="font-weight:700;margin-bottom:3px">' + esc(n) + ' <span style="opacity:.55;font-weight:400">· ' + m[n].length + ' penugasan</span></div>'
          + '<table style="border-collapse:collapse;font-size:12px">' + th + tr + '</table></div>';
      }).join('');
    }
    const cTgl = [{ h: 'Tanggal', f: it => it.tgl }];
    const cShift = [{ h: 'Tanggal', f: it => it.tgl }, { h: 'Shift', f: it => it.shift }];
    const cRcpSwap = [{ h: 'Tanggal', f: it => it.tgl }, { h: 'Shift', f: it => it.shift }, { h: 'Menggantikan', f: it => it.dari }];
    const cPrwSwap = [{ h: 'Tanggal', f: it => it.tgl }, { h: 'Shift', f: it => it.shift }, { h: 'Spesialis', f: it => it.spes || '-' }, { h: 'Menggantikan', f: it => it.dari }];
    const cAsis = [{ h: 'Tanggal', f: it => it.tgl }, { h: 'Shift', f: it => it.shift }, { h: 'Dokter', f: it => it.dokter || '-' }];
    const sec = [];
    if (rc.resepsionisSwap && rc.resepsionisSwap.length)
      sec.push(pbBlok('🔁 Resepsionis diseimbangkan (R-09)', rc.resepsionisSwap.length, tabel(rc.resepsionisSwap, 'ke', cRcpSwap)));
    if (rc.perawatSwap && rc.perawatSwap.length)
      sec.push(pbBlok('🔁 Perawat diseimbangkan (A-07)', rc.perawatSwap.length, tabel(rc.perawatSwap, 'ke', cPrwSwap)));
    if (rc.resepsionisTaruh && rc.resepsionisTaruh.length)
      sec.push(pbBlok('➕ Resepsionis ditempatkan di slot kosong', rc.resepsionisTaruh.length, tabel(rc.resepsionisTaruh, 'nama', cShift)));
    if (rc.resepsionisIsi && rc.resepsionisIsi.length)
      sec.push(pbBlok('🧾 Resepsionis mengisi shift kurang (R-03/R-04)', rc.resepsionisIsi.length, tabel(rc.resepsionisIsi, 'nama', cShift)));
    if (rc.asistensiIsi && rc.asistensiIsi.length)
      sec.push(pbBlok('🩺 Asisten mengisi slot kosong (A-05)', rc.asistensiIsi.length, tabel(rc.asistensiIsi, 'nama', cAsis)));
    if (rc.libur && rc.libur.length)
      sec.push(pbBlok('🗓️ Libur ditambah (N-02/R-06)', rc.libur.length, tabel(rc.libur, 'nama', cTgl)));
    if (!sec.length) return '';
    return '<div style="margin-top:10px">' + sec.join('') + '</div>';
  }
  function pbBlok(judul, n, isi) {
    return '<details style="margin:5px 0;border:1px solid rgba(0,0,0,.10);border-radius:8px;overflow:hidden">'
      + '<summary style="cursor:pointer;font-weight:600;padding:7px 10px 7px 22px;background:rgba(0,0,0,.04)">' + esc(judul) + ' · ' + n + '</summary>'
      + '<div style="padding:4px 12px;max-height:260px;overflow:auto">' + isi + '</div></details>';
  }
  function cekFinal() {
    overlay(true, 'Mengaudit…');

    google.script.run.withSuccessHandler(res => {
      overlay(false); refreshMeta();
      if (!res.ok) { p.className='pesan err'; p.textContent=res.pesan; return; }
      if (res.final) { p.className='pesan ok'; p.textContent='✅ Jadwal FINAL (' + res.stempel + ').' + (res.warning?' '+res.warning+' warning non-blocker.':''); }
      else {
        p.className='pesan err';
        const rinci = res.rinci || (res.daftar||[]).map(s => ({ kode:'', keluarga:'D', lokasi:String(s), detail:'' }));
        const namaKel = { N:'Perawat (N)', A:'Asistensi (A)', R:'Resepsionis (R)', D:'Data & Operasional' };
        let html = '<div style="font-weight:600;margin-bottom:2px">❌ Belum final — ' + res.blocker + ' blocker (perbaiki dulu):</div>';
        ['N','A','R','D'].forEach(k => {
          const arr = rinci.filter(x => (x.keluarga||'D') === k);
          if (!arr.length) return;
          html += '<div style="font-weight:600;margin:6px 0 1px;font-size:12px">▸ ' + namaKel[k] + '</div>';
          arr.forEach(x => {
            html += '<div style="padding:2px 0 2px 8px;font-size:12px;line-height:1.45">' +
              '<b style="color:#c5221f">' + esc(x.kode) + '</b>' +
              (x.lokasi ? ' · <b>' + esc(x.lokasi) + '</b>' : '') +
              (x.detail ? ' — ' + esc(x.detail) : '') + '</div>';
          });
        });
        p.innerHTML = html;
      }
      refreshKesesuaianAksi(); // segarkan rekap kesesuaian di bawah
    }).withFailureHandler(e=>{ overlay(false); p.className='pesan err'; p.textContent='Error: '+e.message; }).cekFinalWeb();
  }

  function renderAksesList() {
    const q = (document.getElementById('haSearch') ? document.getElementById('haSearch').value : '').toLowerCase();
    const rows = AKSES.filter(r => !q || (r.email||'').toLowerCase().includes(q) || (r.nama||'').toLowerCase().includes(q) || (r.peran||'').toLowerCase().includes(q));
    const hit = document.getElementById('haHitung'); if (hit) hit.textContent = rows.length + ' email terdaftar';
    const box = document.getElementById('haList'); if (!box) return;
    if (!rows.length) { box.innerHTML = '<em class="muted">Belum ada email.</em>'; return; }
    const badge = p => { const c = p==='Admin' ? 'background:#fde8e8;color:#b02a2a' : (p==='SPV' ? 'background:#e8f0fe;color:#1a56c4' : 'background:#eef2f5;color:#555'); return '<span style="font-size:11px;font-weight:600;padding:1px 8px;border-radius:6px;'+c+'">'+esc(p)+'</span>'; };
    let h = '<div style="overflow-x:auto"><table><tr><th>Email</th><th>Peran</th><th>Nama</th><th class="text-right">Aksi</th></tr>';
    rows.forEach(r => {
      h += '<tr><td>'+esc(r.email)+'</td><td>'+badge(r.peran)+'</td><td class="muted">'+esc(r.nama||'—')+'</td>' +
        '<td class="text-right"><div class="flex gap-2 justify-end">' +
        '<span title="Edit" onclick="editAkses('+r.baris+')" class="cursor-pointer text-slate-400 hover:text-brand">'+IC_EDIT+'</span>' +
        '<span title="Hapus" onclick="hapusAkses('+r.baris+')" class="cursor-pointer text-slate-400 hover:text-red-600">'+IC_DEL+'</span>' +
        '</div></td></tr>';
    });
    box.innerHTML = h + '</table></div>';
  }
  function aksesFormHtml() {
    return '<label>Email *</label><input id="haEmailInp" type="email" placeholder="nama@domain.com">' +
      '<div class="baris2"><div><label>Peran *</label><select id="haPeranInp"><option value="Admin">Admin</option><option value="SPV">SPV</option><option value="Viewer">Viewer</option></select></div>' +
      '<div><label>Nama</label><input id="haNamaInp" placeholder="Nama staf"></div></div>' +
      '<button class="act" id="haSaveBtn" onclick="simpanAkses()" style="display:flex;align-items:center;justify-content:center;gap:8px">'+IC_SAVE+'<span id="haSaveTxt">Simpan</span></button>' +
      '<button class="act sec" onclick="hideAksesForm()">Batal</button>';
  }
  function showAksesTambah() {
    aksesEdit = null;
    document.getElementById('haForm').innerHTML = aksesFormHtml();
    document.getElementById('haSaveTxt').textContent = 'Simpan';
    document.getElementById('haAddBtn').style.display = 'none';
  }
  function editAkses(baris) {
    const r = AKSES.filter(x => x.baris === baris)[0]; if (!r) return;
    aksesEdit = baris;
    document.getElementById('haForm').innerHTML = aksesFormHtml();
    document.getElementById('haEmailInp').value = r.email;
    document.getElementById('haPeranInp').value = r.peran;
    document.getElementById('haNamaInp').value = r.nama || '';
    document.getElementById('haSaveTxt').textContent = 'Simpan Perubahan';
    document.getElementById('haAddBtn').style.display = 'none';
  }
  function hideAksesForm() { aksesEdit = null; const f = document.getElementById('haForm'); if (f) f.innerHTML = ''; const b = document.getElementById('haAddBtn'); if (b) b.style.display = 'flex'; }
  function simpanAkses() {
    const email = document.getElementById('haEmailInp').value.trim();
    const peran = document.getElementById('haPeranInp').value;
    const nama = document.getElementById('haNamaInp').value.trim();
    const pn = document.getElementById('haAksesPesan');
    if (!email) { pn.className='pesan err'; pn.textContent='Email wajib diisi.'; return; }
    const data = { email: email, peran: peran, nama: nama };
    const btn = document.getElementById('haSaveBtn'); btn.disabled = true;
    const cb = res => { btn.disabled=false;
      if (res.ok) { hideAksesForm(); pn.className='pesan ok'; pn.textContent=res.pesan; muatAkses(); }
      else { pn.className='pesan err'; pn.textContent=res.pesan; }
    };
    const fail = e => { btn.disabled=false; pn.className='pesan err'; pn.textContent='Error: '+e.message; };
    if (aksesEdit) google.script.run.withSuccessHandler(cb).withFailureHandler(fail).updateAksesWeb(aksesEdit, data);
    else google.script.run.withSuccessHandler(cb).withFailureHandler(fail).addAksesWeb(data);
  }
  function hapusAkses(baris) {
    const r = AKSES.filter(x => x.baris === baris)[0];
    if (!confirm('Hapus akses ' + (r ? r.email : 'ini') + '?')) return;
    google.script.run.withSuccessHandler(res => {
      const pn = document.getElementById('haAksesPesan'); pn.className='pesan '+(res.ok?'ok':'err'); pn.textContent=res.pesan; muatAkses();
    }).withFailureHandler(e => { const pn=document.getElementById('haAksesPesan'); if(pn){pn.className='pesan err'; pn.textContent='Gagal: '+e.message;} }).deleteAksesWeb(baris);
  }
  function muatAkses() {
    google.script.run.withSuccessHandler(d => { AKSES = (d && d.list) || []; renderAksesList(); }).getAksesListWeb();
  }

  function mdTab(j) {
    mdJenis = j; mdEditId = null;
    const base = 'seg flex items-center justify-center gap-1.5 py-2 rounded-lg text-[13px] font-medium transition ';
    const on = 'bg-white dark:bg-slate-900 text-brand shadow-sm', off = 'text-slate-500';
    const dok = document.getElementById('segDok'); if (dok) dok.className = base + (j==='dokter'?on:off);
    document.getElementById('segPrw').className = base + (j==='perawat'?on:off);
    document.getElementById('segRcp').className = base + (j==='receptionist'?on:off);
    const ex = document.getElementById('mdFExtra');
    const lv = document.getElementById('mdFLevel');
    if (j === 'perawat') { ex.innerHTML = '<option value="">Semua Kategori</option><option>Existing</option><option>New</option>'; ex.style.display=''; lv.style.display=''; }
    else if (j === 'dokter') { ex.innerHTML = '<option value="">Semua Spesialisasi</option>' + SPES8.map(s=>'<option>'+s+'</option>').join(''); ex.style.display=''; lv.style.display='none'; }
    else { ex.innerHTML = '<option value="">—</option>'; ex.style.display='none'; lv.style.display=''; }
    renderForm();
    hideForm();
    muatMaster();

    document.getElementById('btnTambah').style.display = 'none';
    document.getElementById('mCancel').style.display = '';

    mdEditId = null;
    const w = document.getElementById('mdFormWrap'); if (w) w.style.display = 'none';
    const b = document.getElementById('btnTambah'); if (b) b.style.display = 'flex';

  function dokterFormHtml() {
    const opt = (arr, ph) => '<option value="">'+ (ph||'— pilih —') +'</option>' + arr.map(x=>'<option>'+x+'</option>').join('');
    const hari = ['SENIN','SELASA','RABU','KAMIS','JUMAT','SABTU','MINGGU'];
    return '<label>Nama Dokter *</label><input id="mNama" placeholder="drg. Nama, Sp.XX">' +
      '<label>Spesialisasi *</label><select id="mSpes">' + opt(SPES8) + '</select>' +
      '<div class="baris2"><div><label>Hari Praktek *</label><select id="mHari">' + opt(hari) + '</select></div>' +
      '<div><label>Kategori Shift *</label><select id="mKatShift">' + opt(['Pagi','Siang']) + '</select></div></div>' +
      '<div class="baris2"><div><label>Jam Awal</label><input id="mJamAwal" placeholder="10:00"></div>' +
      '<div><label>Jam Akhir</label><input id="mJamAkhir" placeholder="14:00"></div></div>' +
      '<label>Jam Shift *</label><select id="mJamShift">' + opt(['09:00-15:00','15:00-21:00']) + '</select>' +
      '<label>Kebutuhan Asisten *</label><input id="mKebut" type="number" min="1" value="1">' +
      '<label>Email <span class="muted" style="font-weight:400">(opsional — auto-daftar akses Viewer)</span></label><input id="mEmail" type="email" placeholder="email@domain.com">' +
      '<button class="act" id="mBtn" onclick="simpanMaster()" style="display:flex;align-items:center;justify-content:center;gap:8px">' + IC_SAVE + '<span id="mBtnTxt">Tambah Data</span></button>' +
      '<button class="act sec" id="mCancel" onclick="batalEdit()" style="display:none">Batal edit</button>' +
      '<div class="muted" style="font-size:11px;margin-top:6px">Satu dokter boleh punya beberapa baris (hari/shift berbeda) dengan ID sama.</div>';
  }
  function renderForm(edit) {
    const f = document.getElementById('mdForm');
    if (mdJenis === 'dokter') { f.innerHTML = dokterFormHtml(); return; }
    const radio = (name, val, ic) => '<label class="radio-card"><input type="radio" name="'+name+'" value="'+val+'" onchange="pickRadio(this)">'+ic+'<span>'+val+'</span></label>';
    let h = '<label>Nama *</label><input id="mNama" placeholder="Nama lengkap">' +
      '<label>Level *</label><div class="rgroup grid grid-cols-2 gap-2">' + radio('mLevel','Gold',IC_GOLD) + radio('mLevel','Silver',IC_SILVER) + '</div>';
    if (mdJenis === 'perawat') {
      h += '<label>Kategori *</label><div class="rgroup grid grid-cols-2 gap-2">' + radio('mKat','Existing',IC_EXIST) + radio('mKat','New',IC_NEW) + '</div>' +
        '<div class="flex items-center justify-between mt-2.5"><label class="!mt-0">Kapabilitas Spesialis</label>' +
        '<label class="!mt-0 text-[11px] text-brand cursor-pointer flex items-center gap-1"><input type="checkbox" id="mAll" onchange="toggleAllKapab(this)"> Pilih semua</label></div>' +
        '<div id="mKapab" class="grid grid-cols-2 gap-1.5 mt-1"></div>';
    }
    h += '<label>Email <span class="muted" style="font-weight:400">(opsional — untuk jadwal pribadi via login)</span></label><input id="mEmail" type="email" placeholder="email@domain.com">';
    h += '<button class="act" id="mBtn" onclick="simpanMaster()" style="display:flex;align-items:center;justify-content:center;gap:8px">' + IC_SAVE + '<span id="mBtnTxt">Tambah Data</span></button>' +
      '<button class="act sec" id="mCancel" onclick="batalEdit()" style="display:none">Batal edit</button>';
    f.innerHTML = h;
    if (mdJenis === 'perawat') {
      const box = document.getElementById('mKapab');
      SPES8.forEach(s => { const l=document.createElement('label'); l.className='kapab-item'; l.innerHTML='<input type="checkbox" class="mcb" value="'+s+'"><span>'+s+'</span>'; box.appendChild(l); });
    }
  }

  function toggleAllKapab(cb) { document.querySelectorAll('.mcb').forEach(c => c.checked = cb.checked); }
  function pickRadio(inp) {
    inp.closest('.rgroup').querySelectorAll('.radio-card').forEach(c => c.classList.remove('sel'));
    inp.closest('.radio-card').classList.add('sel');
  }
  function getRadio(name) { const el = document.querySelector('input[name="'+name+'"]:checked'); return el ? el.value : ''; }
  function setRadio(name, val) {
    const el = document.querySelector('input[name="'+name+'"][value="'+val+'"]');
    if (el) { el.checked = true; el.closest('.radio-card').classList.add('sel'); }
  }

  function muatMaster() {
    google.script.run.withSuccessHandler(rows => { mdRows = rows || []; renderTabel(); })
      .withFailureHandler(e => { document.getElementById('mdList').innerHTML = '<em class="muted">Gagal memuat: '+esc(e.message)+'</em>'; }).webGetMaster(mdJenis);
  }

  function renderTabel() {
    const q = (document.getElementById('mdSearch').value||'').toLowerCase();
    const fLv = document.getElementById('mdFLevel').value;
    const fEx = document.getElementById('mdFExtra').value;
    const fSt = document.getElementById('mdFStatus').value;
    let rows = mdRows.filter(r => {
      if (q && !((r.nama||'').toLowerCase().includes(q) || (r.id||'').toLowerCase().includes(q) || (r.kapabilitas||'').toLowerCase().includes(q) || (r.spesialisasi||'').toLowerCase().includes(q))) return false;
      if (mdJenis!=='dokter' && fLv && r.level !== fLv) return false;
      if (fEx && mdJenis==='perawat' && r.kategori !== fEx) return false;
      if (fEx && mdJenis==='dokter' && r.spesialisasi !== fEx) return false;
      if (fSt === 'aktif' && r.aktif === 'Tidak') return false;
      if (fSt === 'nonaktif' && r.aktif !== 'Tidak') return false;
      return true;
    });
    const el = document.getElementById('mdList');
    if (!rows.length) { el.innerHTML = '<em class="muted">Tidak ada data yang cocok.</em>'; return; }
    const aksiCell = (r, off) => '<td class="text-right"><div class="flex gap-2 justify-end">' +
      '<span title="Edit" onclick="editData(\''+esc(r.id)+'\')" class="cursor-pointer text-slate-400 hover:text-brand">'+IC_EDIT+'</span>' +
      (off
        ? '<span title="Aktifkan" onclick="setAktif(\''+esc(r.id)+'\',\'Ya\')" class="cursor-pointer text-slate-400 hover:text-emerald-600">'+IC_ON+'</span>'
        : '<span title="Nonaktifkan" onclick="softDelete(\''+esc(r.id)+'\',\''+esc(r.nama)+'\')" class="cursor-pointer text-slate-400 hover:text-red-600">'+IC_DEL+'</span>') +
      '</div></td>';
    let h;
    if (mdJenis === 'dokter') {
      h = '<div style="overflow-x:auto"><table><tr><th>ID</th><th>Nama</th><th>Spesialisasi</th><th>Hari</th><th>Shift</th><th>Asisten</th><th class="text-right">Aksi</th></tr>';
      rows.forEach(r => { const off = r.aktif === 'Tidak';
        h += '<tr style="opacity:'+(off?.5:1)+'"><td>'+esc(r.id)+'</td><td>'+esc(r.nama)+(off?' <span class="muted">(nonaktif)</span>':'')+'</td><td>'+esc(r.spesialisasi||'—')+'</td><td>'+esc(r.hariPraktek||'—')+'</td><td>'+esc(r.kategoriShift||'—')+'</td><td>'+esc(r.kebutuhanAsisten||'')+'</td>'+aksiCell(r,off)+'</tr>'; });
    } else {
      h = '<div style="overflow-x:auto"><table><tr><th>ID</th><th>Nama</th><th>Level</th>' + (mdJenis==='perawat' ? '<th>Kategori</th><th>Kapabilitas</th>' : '<th>Status</th>') + '<th class="text-right">Aksi</th></tr>';
      rows.forEach(r => { const off = r.aktif === 'Tidak';
        const lv = '<span class="lv '+ (r.level||'').toLowerCase() +'" style="padding:1px 6px;border-radius:6px">'+esc(r.level)+'</span>';
        h += '<tr style="opacity:'+(off?.5:1)+'"><td>'+esc(r.id)+'</td><td>'+esc(r.nama)+(off?' <span class="muted">(nonaktif)</span>':'')+'</td><td>'+lv+'</td>' +
          (mdJenis==='perawat' ? '<td>'+esc(r.kategori)+'</td><td class="muted">'+esc(r.kapabilitas||'—')+'</td>' : '<td>'+(off?'Nonaktif':'Aktif')+'</td>') + aksiCell(r,off) + '</tr>'; });
    }
    el.innerHTML = h + '</table></div>';
  }

  function editData(id) {
    const r = mdRows.filter(x => x.id === id)[0]; if (!r) return;
    mdEditId = id;
    renderForm(true);
    if (mdJenis === 'dokter') {
      document.getElementById('mNama').value = r.nama || '';
      document.getElementById('mSpes').value = r.spesialisasi || '';
      document.getElementById('mHari').value = r.hariPraktek || '';
      document.getElementById('mKatShift').value = r.kategoriShift || '';
      document.getElementById('mJamAwal').value = r.jamAwal || '';
      document.getElementById('mJamAkhir').value = r.jamAkhir || '';
      document.getElementById('mJamShift').value = r.jamShift || '';
      document.getElementById('mKebut').value = r.kebutuhanAsisten || 1;
      const emD = document.getElementById('mEmail'); if (emD) emD.value = r.email || '';
    } else {
      document.getElementById('mNama').value = r.nama || '';
      if (r.level) setRadio('mLevel', r.level);
      const emEl = document.getElementById('mEmail'); if (emEl) emEl.value = r.email || '';
      if (mdJenis === 'perawat') {
        if (r.kategori) setRadio('mKat', r.kategori);
        const set = (r.kapabilitas||'').split(',').map(s=>s.trim());
        document.querySelectorAll('.mcb').forEach(c => c.checked = set.indexOf(c.value) !== -1);
      }
    }
    showForm();
    document.getElementById('mBtnTxt').textContent = 'Simpan Perubahan';
    const p = document.getElementById('mdPesan'); p.className='pesan ok'; p.textContent='Mode edit: '+r.id+'. Ubah nama diperbolehkan (akan diberi peringatan).';
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function batalEdit() { hideForm(); }

  function simpanMaster() {
    const p = document.getElementById('mdPesan');
    let data;
    if (mdJenis === 'dokter') {
      const v = id => { const e = document.getElementById(id); return e ? String(e.value).trim() : ''; };
      data = { nama: v('mNama'), spesialisasi: v('mSpes'), hariPraktek: v('mHari'), kategoriShift: v('mKatShift'), jamAwal: v('mJamAwal'), jamAkhir: v('mJamAkhir'), jamShift: v('mJamShift'), kebutuhanAsisten: v('mKebut'), email: v('mEmail') };
    } else {
      data = { nama: document.getElementById('mNama').value.trim(), level: getRadio('mLevel') };
      const emEl = document.getElementById('mEmail'); if (emEl) data.email = emEl.value.trim();
      if (mdJenis === 'perawat') {
        data.kategori = getRadio('mKat');
        data.kapabilitas = Array.from(document.querySelectorAll('.mcb:checked')).map(c=>c.value).join(', ');
      }
    }
    const btn = document.getElementById('mBtn'); btn.disabled = true;
    const cb = res => {
      btn.disabled = false;
      p.className='pesan '+(res.ok?'ok':'err'); p.textContent=res.pesan;
      if (res.ok) { hideForm(); p.className='pesan '+(res.ok?'ok':'err'); p.textContent=res.pesan; muatMaster(); }
    };
    const fail = e => { btn.disabled=false; p.className='pesan err'; p.textContent='Error: '+e.message; };
    if (mdEditId) google.script.run.withSuccessHandler(cb).withFailureHandler(fail).webUpdateMaster(mdJenis, mdEditId, data);
    else google.script.run.withSuccessHandler(cb).withFailureHandler(fail).webAddMaster(mdJenis, data);
  }

  function softDelete(id, nama) {
    if (!confirm('Nonaktifkan "'+nama+'"? Data tidak dihapus, hanya ditandai Tidak Aktif.')) return;
    setAktif(id, 'Tidak');
  }
  function setAktif(id, status) {
    google.script.run.withSuccessHandler(res => {
      const p = document.getElementById('mdPesan'); p.className='pesan '+(res.ok?'ok':'err'); p.textContent=res.pesan; muatMaster();
    }).webSetAktif(mdJenis, id, status);
  }

  function refreshMeta() {
    google.script.run.withSuccessHandler(c => {
      CTX = c;
      document.getElementById('hMeta').innerHTML = '<span class="badge">' + c.peran + '</span> ' + esc(c.email) +
        (c.periodeMulai ? ' · Periode ' + c.periodeMulai + '–' + c.periodeAkhir : ' · periode belum diset');
    }).getWebContext();
  }
</script>
</body>
